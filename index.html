<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Trading Backtester</title>

<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

<style>

:root {

  --bg:#080c11;
  --panel:#10161f;
  --panel2:#151d27;
  --border:#293443;
  --text:#e8edf4;
  --muted:#8793a3;
  --accent:#2962ff;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#f59e0b;

}

* {
  box-sizing:border-box;
}

html,
body {

  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);

  font-family:
    Inter,
    Arial,
    sans-serif;

}

body {

  overflow:hidden;

}

button,
select,
input {

  font:inherit;

}

button {

  cursor:pointer;

}

.app {

  width:100vw;
  height:100vh;

  display:grid;

  grid-template-rows:
    58px 1fr;

}


/* HEADER */

.header {

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 16px;

  background:#0c1118;

  border-bottom:
    1px solid var(--border);

}

.logo {

  display:flex;
  align-items:center;
  gap:10px;

}

.logo-box {

  width:32px;
  height:32px;

  display:grid;
  place-items:center;

  border-radius:7px;

  background:
    var(--accent);

  font-weight:800;

}

.logo-title {

  font-size:14px;
  font-weight:700;

}

.logo-sub {

  color:var(--muted);
  font-size:10px;

}

.status {

  display:flex;
  align-items:center;
  gap:7px;

  color:var(--muted);

  font-size:11px;

}

.status-dot {

  width:7px;
  height:7px;

  border-radius:50%;

  background:
    var(--green);

}


/* MAIN */

.main {

  display:grid;

  grid-template-columns:
    285px 1fr;

  min-height:0;

}


/* SIDEBAR */

.sidebar {

  overflow-y:auto;

  padding:12px;

  background:
    var(--panel);

  border-right:
    1px solid var(--border);

}

.section {

  margin-bottom:16px;

}

.title {

  color:var(--muted);

  font-size:10px;
  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.08em;

  margin-bottom:8px;

}


/* DATA */

.data-tabs {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

  margin-bottom:8px;

}

.tab {

  padding:8px;

  border:1px solid var(--border);

  background:
    var(--panel2);

  color:var(--muted);

  border-radius:6px;

}

.tab.active {

  color:white;

  border-color:
    var(--accent);

  background:
    rgba(41,98,255,.12);

}

.data-box {

  padding:10px;

  border:
    1px solid var(--border);

  border-radius:7px;

  background:
    #0d131b;

}

.field {

  margin-bottom:9px;

}

label {

  display:block;

  color:var(--muted);

  font-size:10px;

  margin-bottom:4px;

}

select,
input[type=date],
input[type=file] {

  width:100%;

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:6px;

  background:#080d13;

  color:var(--text);

}

.primary {

  width:100%;

  border:0;

  border-radius:6px;

  padding:9px;

  background:
    var(--accent);

  color:white;

  font-weight:700;

}

.status-box {

  margin-top:8px;

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:6px;

  color:var(--muted);

  font-size:10px;

  line-height:1.5;

}

.status-box.ok {

  color:#8de0a4;

}

.status-box.error {

  color:#ff9c9c;

}


/* TOOLS */

.tools {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

}

.tool {

  padding:7px 5px;

  border:
    1px solid var(--border);

  border-radius:5px;

  background:
    var(--panel2);

  color:var(--muted);

  font-size:10px;

}

.tool.active {

  color:white;

  border-color:
    var(--accent);

  background:
    rgba(41,98,255,.15);

}

.tool-danger {

  color:#ff9c9c;

}


/* STATS */

.stats {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

}

.stat {

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:6px;

  background:
    var(--panel2);

}

.stat-label {

  color:var(--muted);

  font-size:9px;

}

.stat-value {

  margin-top:3px;

  font-size:13px;

  font-weight:700;

}


/* WORKSPACE */

.workspace {

  min-width:0;
  min-height:0;

  display:grid;

  grid-template-rows:
    42px 1fr 50px;

}


/* TOOLBAR */

.toolbar {

  display:flex;

  align-items:center;

  gap:5px;

  padding:5px 8px;

  border-bottom:
    1px solid var(--border);

  background:
    #0c1118;

}

.toolbar button {

  padding:
    6px 9px;

  border:
    1px solid var(--border);

  border-radius:5px;

  background:
    var(--panel2);

  color:var(--text);

  font-size:10px;

}

.toolbar-spacer {

  flex:1;

}

.tf-buttons {

  display:flex;

  gap:3px;

}

.tf {

  min-width:37px;

}

.tf.active {

  background:
    rgba(41,98,255,.2);

  border-color:
    var(--accent);

  color:white;

}


/* CHART */

.chart-area {

  position:relative;

  min-width:0;
  min-height:0;

  background:
    #080c11;

}

#chart {

  position:absolute;

  inset:0;

}

#drawingCanvas {

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

}

.chart-message {

  position:absolute;

  inset:0;

  display:grid;

  place-items:center;

  color:var(--muted);

  font-size:12px;

  pointer-events:none;

}


/* BOTTOM */

.bottom {

  display:flex;

  align-items:center;

  gap:10px;

  padding:8px 12px;

  background:#0c1118;

  border-top:
    1px solid var(--border);

}

.bottom-info {

  color:var(--muted);

  font-size:10px;

}

.progress {

  flex:1;

  height:3px;

  background:#27303b;

}

.progress-fill {

  height:100%;

  width:0;

  background:
    var(--accent);

}


/* MOBILE */

@media(max-width:850px) {

  body {
    overflow:auto;
  }

  .main {

    grid-template-columns:1fr;

  }

  .sidebar {

    border-right:0;

    border-bottom:
      1px solid var(--border);

  }

  .workspace {

    height:70vh;

  }

}

</style>

</head>

<script>

"use strict";


/*
|--------------------------------------------------------------------------
| STATE
|--------------------------------------------------------------------------
*/

const state = {

  rawCandles: [],

  candles: [],

  timeframe: 1,

  currentIndex: -1,

  position: null,

  trades: [],

  pnl: 0,

  playing: false,

  timer: null,

  drawingTool: "cursor",

  drawings: [],

  drawingStart: null,

  drawingPreview: null

};


/*
|--------------------------------------------------------------------------
| DOM
|--------------------------------------------------------------------------
*/

const chartArea =
  document.getElementById(
    "chartArea"
  );

const chartElement =
  document.getElementById(
    "chart"
  );

const canvas =
  document.getElementById(
    "drawingCanvas"
  );

const ctx =
  canvas.getContext("2d");

const message =
  document.getElementById(
    "chartMessage"
  );


/*
|--------------------------------------------------------------------------
| CHART
|--------------------------------------------------------------------------
*/

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout: {

        background: {
          color:"#080c11"
        },

        textColor:"#8995a5"

      },

      grid: {

        vertLines: {
          color:"#17202a"
        },

        horzLines: {
          color:"#17202a"
        }

      },

      crosshair: {

        mode:
          LightweightCharts
            .CrosshairMode
            .Normal

      },

      rightPriceScale: {

        borderColor:
          "#293443"

      },

      timeScale: {

        borderColor:
          "#293443",

        timeVisible:true,

        secondsVisible:false

      }

    }
  );


const series =
  chart.addCandlestickSeries({

    upColor:"#16a34a",

    downColor:"#dc2626",

    borderUpColor:"#16a34a",

    borderDownColor:"#dc2626",

    wickUpColor:"#16a34a",

    wickDownColor:"#dc2626"

  });


/*
|--------------------------------------------------------------------------
| RESIZE
|--------------------------------------------------------------------------
*/

function resize() {

  chart.resize(
    chartElement.clientWidth,
    chartElement.clientHeight
  );

  canvas.width =
    chartArea.clientWidth *
    window.devicePixelRatio;

  canvas.height =
    chartArea.clientHeight *
    window.devicePixelRatio;

  canvas.style.width =
    chartArea.clientWidth +
    "px";

  canvas.style.height =
    chartArea.clientHeight +
    "px";

  ctx.setTransform(
    window.devicePixelRatio,
    0,
    0,
    window.devicePixelRatio,
    0,
    0
  );

  redrawDrawings();

}

window.addEventListener(
  "resize",
  resize
);


/*
|--------------------------------------------------------------------------
| DATA AGGREGATOR
|--------------------------------------------------------------------------
*/

function aggregateCandles(
  source,
  minutes
) {

  if (
    minutes === 1
  ) {

    return source.map(
      candle => ({
        ...candle
      })
    );

  }


  const buckets =
    new Map();


  const seconds =
    minutes * 60;


  for (
    const candle of source
  ) {

    const bucket =
      Math.floor(
        candle.time /
        seconds
      ) *
      seconds;


    let item =
      buckets.get(
        bucket
      );


    if (!item) {

      item = {

        time:bucket,

        open:candle.open,

        high:candle.high,

        low:candle.low,

        close:candle.close

      };

      buckets.set(
        bucket,
        item
      );

    } else {

      item.high =
        Math.max(
          item.high,
          candle.high
        );

      item.low =
        Math.min(
          item.low,
          candle.low
        );

      item.close =
        candle.close;

    }

  }


  return Array.from(
    buckets.values()
  ).sort(
    (a,b) =>
      a.time - b.time
  );

}


/*
|--------------------------------------------------------------------------
| CHANGE TIMEFRAME
|--------------------------------------------------------------------------
*/

function changeTimeframe(
  minutes
) {

  state.timeframe =
    Number(minutes);


  stopReplay();


  /*
   * IMPORTANT:
   *
   * NO API REQUEST.
   *
   * Everything happens locally.
   */

  state.candles =
    aggregateCandles(
      state.rawCandles,
      state.timeframe
    );


  state.currentIndex =
    state.candles.length
      ? 0
      : -1;


  state.position = null;

  state.trades = [];

  state.pnl = 0;


  renderChart();


  updateStats();

  updateReplay();


  updateTimeframeUI();


  redrawDrawings();

}


/*
|--------------------------------------------------------------------------
| RENDER CHART
|--------------------------------------------------------------------------
*/

function renderChart() {

  if (!state.candles.length) {

    series.setData([]);

    message.style.display =
      "grid";

    return;

  }


  message.style.display =
    "none";


  const visible =
    state.candles.slice(
      0,
      state.currentIndex + 1
    );


  series.setData(
    visible
  );


  if (
    visible.length
  ) {

    chart.timeScale()
      .fitContent();

  }

}


/*
|--------------------------------------------------------------------------
| LOAD SERVER DATA
|--------------------------------------------------------------------------
*/

async function loadAutomatic() {

  const status =
    document.getElementById(
      "dataStatus"
    );


  status.textContent =
    "Downloading base 1-minute dataset...";


  status.className =
    "status-box";


  const params =
    new URLSearchParams();


  params.set(
    "pair",
    document.getElementById(
      "pair"
    ).value
  );


  params.set(
    "outputsize",
    document.getElementById(
      "outputsize"
    ).value
  );


  const start =
    document.getElementById(
      "startDate"
    ).value;


  const end =
    document.getElementById(
      "endDate"
    ).value;


  if (start) {

    params.set(
      "startDate",
      start
    );

  }


  if (end) {

    params.set(
      "endDate",
      end
    );

  }


  try {

    /*
     * API request
     *
     * IMPORTANT:
     * The API key remains on the server.
     * The browser only calls our own backend.
     */

    const apiUrl =
      `/api/fx/base-candles?${params.toString()}`;


    console.log(
      "REQUESTING:",
      apiUrl
    );


    const response =
      await fetch(
        apiUrl,
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Data request failed."
      );

    }


    state.rawCandles =
      data.candles;


    /*
     * Generate selected timeframe locally.
     */

    state.candles =
      aggregateCandles(
        state.rawCandles,
        state.timeframe
      );


    state.currentIndex =
      state.candles.length
        ? 0
        : -1;


    state.position = null;

    state.trades = [];

    state.pnl = 0;


    renderChart();

    updateStats();

    updateReplay();


    status.textContent =
      `${data.pair} • ${data.count.toLocaleString()} base 1m candles loaded. Timeframes now switch locally.`;

    status.className =
      "status-box ok";


  } catch (error) {

    console.error(error);

    status.textContent =
      error.message;

    status.className =
      "status-box error";

  }

}


document
  .getElementById("loadData")
  .addEventListener(
    "click",
    loadAutomatic
  );


/*
|--------------------------------------------------------------------------
| TIMEFRAME UI
|--------------------------------------------------------------------------
*/

function updateTimeframeUI() {

  document
    .querySelectorAll(
      ".tf-btn,.tf"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.tf
          ) ===
          state.timeframe
        );

      }
    );

}


document
  .querySelectorAll(
    ".tf-btn,.tf"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          changeTimeframe(
            button.dataset.tf
          );

        }
      );

    }
  );


/*
|--------------------------------------------------------------------------
| MANUAL CSV
|--------------------------------------------------------------------------
*/

function parseCSV(text) {

  const lines =
    text
      .replace(/\r/g,"")
      .split("\n")
      .map(
        x => x.trim()
      )
      .filter(Boolean);


  if (
    lines.length < 2
  ) {

    throw new Error(
      "CSV is empty."
    );

  }


  const headers =
    lines[0]
      .split(",")
      .map(
        x =>
          x.trim()
            .toLowerCase()
      );


  const find =
    names => {

      for (
        const name of names
      ) {

        const index =
          headers.indexOf(
            name
          );

        if (index !== -1) {

          return index;

        }

      }

      return -1;

    };


  const ti =
    find([
      "time",
      "timestamp",
      "datetime",
      "date"
    ]);

  const oi =
    find(["open"]);

  const hi =
    find(["high"]);

  const li =
    find(["low"]);

  const ci =
    find(["close"]);


  if (
    ti < 0 ||
    oi < 0 ||
    hi < 0 ||
    li < 0 ||
    ci < 0
  ) {

    throw new Error(
      "CSV requires time, open, high, low and close."
    );

  }


  const result = [];


  for (
    let i=1;
    i<lines.length;
    i++
  ) {

    const p =
      lines[i].split(",");


    const timestamp =
      new Date(
        p[ti]
      ).getTime();


    const open =
      Number(p[oi]);

    const high =
      Number(p[hi]);

    const low =
      Number(p[li]);

    const close =
      Number(p[ci]);


    if (
      !Number.isFinite(
        timestamp
      ) ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ) {

      continue;

    }


    result.push({

      time:
        Math.floor(
          timestamp / 1000
        ),

      open,

      high,

      low,

      close

    });

  }


  result.sort(
    (a,b) =>
      a.time - b.time
  );


  return result;

}


document
  .getElementById("csv")
  .addEventListener(
    "change",
    async event => {

      const file =
        event.target.files?.[0];

      if (!file) {
        return;
      }


      try {

        const text =
          await file.text();


        state.rawCandles =
          parseCSV(text);


        state.candles =
          aggregateCandles(
            state.rawCandles,
            state.timeframe
          );


        state.currentIndex =
          state.candles.length
            ? 0
            : -1;


        renderChart();

        updateStats();

        updateReplay();


        const status =
          document.getElementById(
            "manualStatus"
          );


        status.textContent =
          `${state.rawCandles.length.toLocaleString()} base candles loaded.`;

        status.className =
          "status-box ok";


      } catch(error) {

        document.getElementById(
          "manualStatus"
        ).textContent =
          error.message;

      }

    }
  );


/*
|--------------------------------------------------------------------------
| REPLAY
|--------------------------------------------------------------------------
*/

function renderReplay() {

  const visible =
    state.candles.slice(
      0,
      state.currentIndex + 1
    );


  series.setData(
    visible
  );


  updateReplay();

  redrawDrawings();

}


function next() {

  if (
    state.currentIndex <
    state.candles.length - 1
  ) {

    state.currentIndex++;

    renderReplay();

  } else {

    stopReplay();

  }

}


function previous() {

  if (
    state.currentIndex > 0
  ) {

    state.currentIndex--;

    renderReplay();

  }

}


function startReplay() {

  if (
    state.playing ||
    !state.candles.length
  ) {
    return;
  }


  state.playing = true;

  document.getElementById(
    "play"
  ).textContent =
    "⏸ Pause";


  const loop = () => {

    if (!state.playing) {
      return;
    }


    next();


    if (
      state.playing
    ) {

      state.timer =
        setTimeout(
          loop,
          500
        );

    }

  };


  loop();

}


function stopReplay() {

  state.playing = false;

  document.getElementById(
    "play"
  ).textContent =
    "▶ Play";


  if (state.timer) {

    clearTimeout(
      state.timer
    );

    state.timer = null;

  }

}


document
  .getElementById("next")
  .addEventListener(
    "click",
    next
  );


document
  .getElementById("prev")
  .addEventListener(
    "click",
    previous
  );


document
  .getElementById("play")
  .addEventListener(
    "click",
    () => {

      if (
        state.playing
      ) {

        stopReplay();

      } else {

        startReplay();

      }

    }
  );


/*
|--------------------------------------------------------------------------
| TRADING
|--------------------------------------------------------------------------
*/

function currentCandle() {

  return state.candles[
    state.currentIndex
  ];

}


function openPosition(
  side
) {

  const candle =
    currentCandle();


  if (
    !candle ||
    state.position
  ) {
    return;
  }


  state.position = {

    side,

    entry:
      candle.close,

    time:
      candle.time

  };


  updateStats();

}


function closePosition() {

  const candle =
    currentCandle();


  if (
    !candle ||
    !state.position
  ) {
    return;
  }


  const p =
    state.position;


  const direction =
    p.side === "LONG"
      ? 1
      : -1;


  const pnl =
    (
      candle.close -
      p.entry
    ) *
    direction;


  state.pnl += pnl;


  state.trades.push({

    side:
      p.side,

    entry:
      p.entry,

    exit:
      candle.close,

    pnl

  });


  state.position = null;


  updateStats();

}


document
  .getElementById("buy")
  .addEventListener(
    "click",
    () =>
      openPosition("LONG")
  );


document
  .getElementById("sell")
  .addEventListener(
    "click",
    () =>
      openPosition("SHORT")
  );


document
  .getElementById("close")
  .addEventListener(
    "click",
    closePosition
  );


/*
|--------------------------------------------------------------------------
| STATS
|--------------------------------------------------------------------------
*/

function updateStats() {

  document.getElementById(
    "candles"
  ).textContent =
    state.candles.length
      .toLocaleString();


  document.getElementById(
    "position"
  ).textContent =
    state.position
      ? state.position.side
      : "FLAT";


  document.getElementById(
    "trades"
  ).textContent =
    state.trades.length;


  document.getElementById(
    "pnl"
  ).textContent =
    state.pnl.toFixed(5);

}


/*
|--------------------------------------------------------------------------
| REPLAY UI
|--------------------------------------------------------------------------
*/

function updateReplay() {

  if (
    !state.candles.length
  ) {

    document.getElementById(
      "replayInfo"
    ).textContent =
      "No data";

    return;

  }


  const candle =
    state.candles[
      state.currentIndex
    ];


  const date =
    new Date(
      candle.time * 1000
    );


  document.getElementById(
    "replayInfo"
  ).textContent =
    `${state.currentIndex + 1} / ${state.candles.length.toLocaleString()} • ${date.toLocaleString()}`;


  const percent =
    state.candles.length > 1
      ? state.currentIndex /
        (state.candles.length - 1) *
        100
      : 100;


  document.getElementById(
    "progressFill"
  ).style.width =
    `${percent}%`;

}


/*
|--------------------------------------------------------------------------
| DRAWING ENGINE
|--------------------------------------------------------------------------
*/

function setDrawingTool(
  tool
) {

  state.drawingTool =
    tool;


  document
    .querySelectorAll(
      ".draw-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.tool ===
          tool
        );

      }
    );


  if (
    tool === "cursor"
  ) {

    canvas.style.pointerEvents =
      "none";

  } else {

    canvas.style.pointerEvents =
      "auto";

  }

}


document
  .querySelectorAll(
    ".draw-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          setDrawingTool(
            button.dataset.tool
          );

        }
      );

    }
  );


/*
|--------------------------------------------------------------------------
| PRICE / TIME CONVERSION
|--------------------------------------------------------------------------
*/

function coordinateToTime(
  x
) {

  return chart.timeScale()
    .coordinateToTime(x);

}


function coordinateToPrice(
  y
) {

  return series.coordinateToPrice(
    y
  );

}


function timeToX(
  time
) {

  return chart.timeScale()
    .timeToCoordinate(
      time
    );

}


function priceToY(
  price
) {

  return series.priceToCoordinate(
    price
  );

}


/*
|--------------------------------------------------------------------------
| DRAW CANVAS
|--------------------------------------------------------------------------
*/

function redrawDrawings() {

  const width =
    chartArea.clientWidth;

  const height =
    chartArea.clientHeight;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  for (
    const drawing of
    state.drawings
  ) {

    drawObject(
      drawing
    );

  }


  if (
    state.drawingPreview
  ) {

    drawObject(
      state.drawingPreview,
      true
    );

  }

}


/*
|--------------------------------------------------------------------------
| DRAW OBJECT
|--------------------------------------------------------------------------
*/

function drawObject(
  d,
  preview=false
) {

  const x1 =
    timeToX(d.t1);

  const y1 =
    priceToY(d.p1);

  const x2 =
    timeToX(d.t2);

  const y2 =
    priceToY(d.p2);


  if (
    x1 === null ||
    y1 === null
  ) {
    return;
  }


  ctx.save();


  ctx.lineWidth =
    1.5;


  ctx.strokeStyle =
    preview
      ? "#8aa4ff"
      : "#d7dee8";


  ctx.fillStyle =
    "rgba(41,98,255,.12)";


  /*
   * HORIZONTAL
   */

  if (
    d.type ===
    "horizontal"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      0,
      y1
    );

    ctx.lineTo(
      chartArea.clientWidth,
      y1
    );

    ctx.stroke();

  }


  /*
   * VERTICAL
   */

  else if (
    d.type ===
    "vertical"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x1,
      0
    );

    ctx.lineTo(
      x1,
      chartArea.clientHeight
    );

    ctx.stroke();

  }


  /*
   * TREND
   */

  else if (
    d.type ===
    "trend"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.stroke();

  }


  /*
   * RAY
   */

  else if (
    d.type ===
    "ray"
  ) {

    const dx =
      x2 - x1;

    const dy =
      y2 - y1;


    let endX =
      chartArea.clientWidth;

    let endY =
      y1 +
      (
        endX -
        x1
      ) *
      dy /
      dx;


    if (
      dx === 0
    ) {

      endX =
        x1;

      endY =
        chartArea.clientHeight;

    }


    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      endX,
      endY
    );

    ctx.stroke();

  }


  /*
   * RECTANGLE
   */

  else if (
    d.type ===
    "rectangle"
  ) {

    const left =
      Math.min(
        x1,
        x2
      );

    const top =
      Math.min(
        y1,
        y2
      );

    const width =
      Math.abs(
        x2 - x1
      );

    const height =
      Math.abs(
        y2 - y1
      );


    ctx.fillRect(
      left,
      top,
      width,
      height
    );


    ctx.strokeRect(
      left,
      top,
      width,
      height
    );

  }


  /*
   * FIB
   */

  else if (
    d.type ===
    "fib"
  ) {

    const levels = [
      0,
      .236,
      .382,
      .5,
      .618,
      .786,
      1
    ];


    for (
      const level of
      levels
    ) {

      const price =
        d.p1 +
        (
          d.p2 -
          d.p1
        ) *
        level;


      const y =
        priceToY(
          price
        );


      if (
        y === null
      ) {
        continue;
      }


      ctx.beginPath();

      ctx.moveTo(
        Math.min(
          x1,
          x2
        ),
        y
      );

      ctx.lineTo(
        Math.max(
          x1,
          x2
        ),
        y
      );

      ctx.stroke();


      ctx.fillStyle =
        "#9aa8ba";

      ctx.font =
        "10px Arial";

      ctx.fillText(
        `${(
          level * 100
        ).toFixed(1)}%`,
        Math.min(
          x1,
          x2
        ) + 4,
        y - 3
      );

    }

  }


  /*
   * MEASURE
   */

  else if (
    d.type ===
    "measure"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.stroke();


    const change =
      (
        d.p2 -
        d.p1
      ) /
      d.p1 *
      100;


    const distance =
      Math.abs(
        d.t2 -
        d.t1
      );


    const hours =
      distance /
      3600;


    ctx.fillStyle =
      "#d7dee8";

    ctx.font =
      "11px Arial";


    ctx.fillText(
      `${change.toFixed(2)}% • ${hours.toFixed(2)}h`,
      x2 + 5,
      y2 - 5
    );

  }


  /*
   * ARROW
   */

  else if (
    d.type ===
    "arrow"
  ) {

    drawArrow(
      x1,
      y1,
      x2,
      y2
    );

  }


  /*
   * TEXT
   */

  else if (
    d.type ===
    "text"
  ) {

    ctx.fillStyle =
      "#e8edf4";

    ctx.font =
      "12px Arial";

    ctx.fillText(
      d.text ||
      "Text",
      x1,
      y1
    );

  }


  ctx.restore();

}


/*
|--------------------------------------------------------------------------
| ARROW
|--------------------------------------------------------------------------
*/

function drawArrow(
  x1,
  y1,
  x2,
  y2
) {

  const angle =
    Math.atan2(
      y2 - y1,
      x2 - x1
    );


  const size =
    9;


  ctx.beginPath();

  ctx.moveTo(
    x1,
    y1
  );

  ctx.lineTo(
    x2,
    y2
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x2,
    y2
  );

  ctx.lineTo(
    x2 -
      size *
      Math.cos(
        angle -
        Math.PI / 6
      ),

    y2 -
      size *
      Math.sin(
        angle -
        Math.PI / 6
      )
  );

  ctx.lineTo(
    x2 -
      size *
      Math.cos(
        angle +
        Math.PI / 6
      ),

    y2 -
      size *
      Math.sin(
        angle +
        Math.PI / 6
      )
  );

  ctx.closePath();

  ctx.fillStyle =
    "#d7dee8";

  ctx.fill();

}


/*
|--------------------------------------------------------------------------
| MOUSE DRAWING
|--------------------------------------------------------------------------
*/

canvas.addEventListener(
  "mousedown",
  event => {

    if (
      state.drawingTool ===
      "cursor"
    ) {
      return;
    }


    const rect =
      canvas.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    const time =
      coordinateToTime(
        x
      );


    const price =
      coordinateToPrice(
        y
      );


    if (
      time === null ||
      price === null
    ) {
      return;
    }


    state.drawingStart = {

      x,

      y,

      time,

      price

    };


    state.drawingPreview = {

      type:
        state.drawingTool,

      t1:
        time,

      p1:
        price,

      t2:
        time,

      p2:
        price

    };


    redrawDrawings();

  }
);


canvas.addEventListener(
  "mousemove",
  event => {

    if (
      !state.drawingStart
    ) {
      return;
    }


    const rect =
      canvas.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    const time =
      coordinateToTime(
        x
      );


    const price =
      coordinateToPrice(
        y
      );


    if (
      time === null ||
      price === null
    ) {
      return;
    }


    state.drawingPreview = {

      type:
        state.drawingTool,

      t1:
        state.drawingStart.time,

      p1:
        state.drawingStart.price,

      t2:
        time,

      p2:
        price

    };


    redrawDrawings();

  }
);


canvas.addEventListener(
  "mouseup",
  event => {

    if (
      !state.drawingStart
    ) {
      return;
    }


    const rect =
      canvas.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    const time =
      coordinateToTime(
        x
      );


    const price =
      coordinateToPrice(
        y
      );


    if (
      time === null ||
      price === null
    ) {

      state.drawingStart =
        null;

      state.drawingPreview =
        null;

      redrawDrawings();

      return;

    }


    const drawing = {

      type:
        state.drawingTool,

      t1:
        state.drawingStart.time,

      p1:
        state.drawingStart.price,

      t2:
        time,

      p2:
        price

    };


    /*
     * Text tool.
     */

    if (
      state.drawingTool ===
      "text"
    ) {

      const text =
        prompt(
          "Enter text:"
        );


      if (
        text
      ) {

        drawing.text =
          text;

      } else {

        state.drawingStart =
          null;

        state.drawingPreview =
          null;

        redrawDrawings();

        return;

      }

    }


    state.drawings.push(
      drawing
    );


    state.drawingStart =
      null;

    state.drawingPreview =
      null;


    redrawDrawings();

  }
);


/*
|--------------------------------------------------------------------------
| UNDO
|--------------------------------------------------------------------------
*/

document
  .getElementById(
    "undoDrawing"
  )
  .addEventListener(
    "click",
    () => {

      state.drawings.pop();

      redrawDrawings();

    }
  );


/*
|--------------------------------------------------------------------------
| CLEAR
|--------------------------------------------------------------------------
*/

document
  .getElementById(
    "clearDrawings"
  )
  .addEventListener(
    "click",
    () => {

      state.drawings = [];

      redrawDrawings();

    }
  );


/*
|--------------------------------------------------------------------------
| TABS
|--------------------------------------------------------------------------
*/

document
  .getElementById("autoTab")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "autoTab"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "manualTab"
        )
        .classList.remove(
          "active"
        );

      document
        .getElementById(
          "autoPanel"
        ).style.display =
        "block";

      document
        .getElementById(
          "manualPanel"
        ).style.display =
        "none";

    }
  );


document
  .getElementById("manualTab")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "manualTab"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "autoTab"
        )
        .classList.remove(
          "active"
        );

      document
        .getElementById(
          "autoPanel"
        ).style.display =
        "none";

      document
        .getElementById(
          "manualPanel"
        ).style.display =
        "block";

    }
  );


/*
|--------------------------------------------------------------------------
| HEALTH
|--------------------------------------------------------------------------
*/

async function health() {

  try {

    const response =
      await fetch(
        "/api/health"
      );


    const data =
      await response.json();


    document.getElementById(
      "systemStatus"
    ).textContent =
      data.automaticData
        ? "Automatic FX data online"
        : "Manual mode";

  } catch {

    document.getElementById(
      "systemStatus"
    ).textContent =
      "Backend unavailable";

  }

}


/*
|--------------------------------------------------------------------------
| KEYBOARD
|--------------------------------------------------------------------------
*/

document.addEventListener(
  "keydown",
  event => {

    if (
      event.target.tagName ===
      "INPUT"
    ) {
      return;
    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      next();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      previous();

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      state.playing
        ? stopReplay()
        : startReplay();

    }

  }
);


/*
|--------------------------------------------------------------------------
| INITIALIZE
|--------------------------------------------------------------------------
*/

setDrawingTool(
  "cursor"
);

updateStats();

updateReplay();

health();

resize();

</script>

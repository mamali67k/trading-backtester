<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Trading Backtester</title>

<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

<style>

:root {

  --bg:#080c11;
  --panel:#10161f;
  --panel2:#151d27;
  --panel3:#1b2430;
  --border:#293443;
  --text:#e8edf4;
  --muted:#8793a3;

  --accent:#2962ff;

  --green:#16a34a;
  --red:#dc2626;
  --yellow:#f59e0b;

  --drawing-bg:#0d131b;

}


* {

  box-sizing:border-box;

}


html,
body {

  margin:0;

  width:100%;
  height:100%;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    Inter,
    Arial,
    sans-serif;

}


body {

  overflow:hidden;

}


button,
select,
input {

  font:inherit;

}


button {

  cursor:pointer;

}


.app {

  width:100vw;
  height:100vh;

  display:grid;

  grid-template-rows:
    58px 1fr;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0 16px;

  background:
    #0c1118;

  border-bottom:
    1px solid var(--border);

}


.logo {

  display:flex;

  align-items:center;

  gap:10px;

}


.logo-box {

  width:32px;
  height:32px;

  display:grid;

  place-items:center;

  border-radius:7px;

  background:
    var(--accent);

  font-weight:800;

}


.logo-title {

  font-size:14px;

  font-weight:700;

}


.logo-sub {

  color:
    var(--muted);

  font-size:10px;

}


.status {

  display:flex;

  align-items:center;

  gap:7px;

  color:
    var(--muted);

  font-size:11px;

}


.status-dot {

  width:7px;
  height:7px;

  border-radius:50%;

  background:
    var(--green);

}


/* =========================================================
   MAIN
   ========================================================= */

.main {

  display:grid;

  grid-template-columns:
    285px 1fr;

  min-height:0;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

  overflow-y:auto;

  padding:12px;

  background:
    var(--panel);

  border-right:
    1px solid var(--border);

}


.section {

  margin-bottom:16px;

}


.title {

  color:
    var(--muted);

  font-size:10px;

  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.08em;

  margin-bottom:8px;

}


/* =========================================================
   DATA
   ========================================================= */

.data-tabs {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

  margin-bottom:8px;

}


.tab {

  padding:8px;

  border:
    1px solid var(--border);

  background:
    var(--panel2);

  color:
    var(--muted);

  border-radius:6px;

}


.tab.active {

  color:white;

  border-color:
    var(--accent);

  background:
    rgba(41,98,255,.12);

}


.data-box {

  padding:10px;

  border:
    1px solid var(--border);

  border-radius:7px;

  background:
    #0d131b;

}


.field {

  margin-bottom:9px;

}


label {

  display:block;

  color:
    var(--muted);

  font-size:10px;

  margin-bottom:4px;

}


select,
input[type=date],
input[type=file] {

  width:100%;

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:6px;

  background:
    #080d13;

  color:
    var(--text);

}


.primary {

  width:100%;

  border:0;

  border-radius:6px;

  padding:9px;

  background:
    var(--accent);

  color:white;

  font-weight:700;

}


.primary:disabled {

  opacity:.55;

  cursor:not-allowed;

}


.status-box {

  margin-top:8px;

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:6px;

  color:
    var(--muted);

  font-size:10px;

  line-height:1.5;

}


.status-box.ok {

  color:#8de0a4;

}


.status-box.error {

  color:#ff9c9c;

}


/* =========================================================
   TIMEFRAME
   ========================================================= */

.tools {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

}


.tool {

  padding:7px 5px;

  border:
    1px solid var(--border);

  border-radius:5px;

  background:
    var(--panel2);

  color:
    var(--muted);

  font-size:10px;

}


.tool.active {

  color:white;

  border-color:
    var(--accent);

  background:
    rgba(41,98,255,.15);

}


/* =========================================================
   STATS
   ========================================================= */

.stats {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

}


.stat {

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:6px;

  background:
    var(--panel2);

}


.stat-label {

  color:
    var(--muted);

  font-size:9px;

}


.stat-value {

  margin-top:3px;

  font-size:13px;

  font-weight:700;

}


/* =========================================================
   WORKSPACE
   ========================================================= */

.workspace {

  min-width:0;

  min-height:0;

  display:grid;

  grid-template-rows:
    42px 1fr 50px;

}


/* =========================================================
   TOP TOOLBAR
   ========================================================= */

.toolbar {

  display:flex;

  align-items:center;

  gap:5px;

  padding:
    5px 8px;

  border-bottom:
    1px solid var(--border);

  background:
    #0c1118;

}


.toolbar button {

  min-width:32px;

  height:30px;

  padding:
    5px 9px;

  border:
    1px solid var(--border);

  border-radius:5px;

  background:
    var(--panel2);

  color:
    var(--text);

  font-size:10px;

}


.toolbar button:hover {

  background:
    var(--panel3);

}


.toolbar-spacer {

  flex:1;

}


.tf-buttons {

  display:flex;

  gap:3px;

}


.tf {

  min-width:37px;

}


.tf.active {

  background:
    rgba(41,98,255,.2);

  border-color:
    var(--accent);

  color:white;

}


#buy {

  color:#7ee2a8;

}


#sell {

  color:#ff8e8e;

}


#close {

  color:#f4c76b;

}


/* =========================================================
   CHART
   ========================================================= */

.chart-area {

  position:relative;

  min-width:0;

  min-height:0;

  overflow:hidden;

  background:
    #080c11;

}


#chart {

  position:absolute;

  inset:0;

}


.chart-message {

  position:absolute;

  inset:0;

  display:grid;

  place-items:center;

  color:
    var(--muted);

  font-size:12px;

  pointer-events:none;

  z-index:5;

}


/* =========================================================
   DRAWING TOOLBAR
   ========================================================= */

.drawing-toolbar {

  position:absolute;

  top:12px;

  left:8px;

  z-index:30;

  width:44px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:4px;

  padding:5px;

  background:
    rgba(13,19,27,.96);

  border:
    1px solid var(--border);

  border-radius:7px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  transition:
    width .18s ease;

}


.drawing-toolbar.open {

  width:44px;

}


.drawing-toolbar.collapsed {

  width:36px;

  padding:
    4px;

}

.drawing-toolbar.collapsed .drawing-tool[data-tool],
.drawing-toolbar.collapsed .drawing-divider {

  display:none;

}


.drawing-tool {

  position:relative;

  width:34px;
  height:34px;

  display:grid;

  place-items:center;

  padding:0;

  border:
    1px solid transparent;

  border-radius:5px;

  background:
    transparent;

  color:
    #aeb8c6;

}


.drawing-tool:hover {

  color:white;

  background:
    rgba(255,255,255,.06);

  border-color:
    #344151;

}


.drawing-tool.active {

  color:white;

  background:
    rgba(41,98,255,.2);

  border-color:
    var(--accent);

}


.drawing-tool svg {

  width:18px;
  height:18px;

  stroke:currentColor;

  fill:none;

  stroke-width:1.7;

  stroke-linecap:round;

  stroke-linejoin:round;

}


.drawing-tool.fill-icon svg {

  fill:currentColor;

  stroke:none;

}


.drawing-divider {

  width:24px;

  height:1px;

  margin:2px 0;

  background:
    #2a3542;

}


.drawing-collapse {

  color:
    #9aa7b7;

}


.drawing-collapse svg {

  transition:
    transform .18s ease;

}


.drawing-toolbar.collapsed
.drawing-collapse svg {

  transform:
    rotate(180deg);

}


/* TOOLTIP */

.drawing-tool::after {

  content:
    attr(data-tooltip);

  position:absolute;

  left:42px;

  top:50%;

  transform:
    translateY(-50%);

  white-space:nowrap;

  padding:
    5px 8px;

  border-radius:5px;

  background:
    #111923;

  border:
    1px solid #344151;

  color:
    #e8edf4;

  font-size:10px;

  pointer-events:none;

  opacity:0;

  visibility:hidden;

  transition:
    opacity .12s ease;

  box-shadow:
    0 5px 15px rgba(0,0,0,.3);

}


.drawing-tool:hover::after {

  opacity:1;

  visibility:visible;

}


.drawing-toolbar.collapsed
.drawing-tool::after {

  left:39px;

}


/* =========================================================
   DRAWING CANVAS
   ========================================================= */

#drawingCanvas {

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  z-index:20;

  touch-action:none;

}


/* =========================================================
   BOTTOM
   ========================================================= */

.bottom {

  display:flex;

  align-items:center;

  gap:10px;

  padding:
    8px 12px;

  background:
    #0c1118;

  border-top:
    1px solid var(--border);

}


.bottom-info {

  color:
    var(--muted);

  font-size:10px;

}


.progress {

  flex:1;

  height:3px;

  background:
    #27303b;

  border-radius:2px;

  overflow:hidden;

}


.progress-fill {

  height:100%;

  width:0;

  background:
    var(--accent);

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:850px) {

  body {

    overflow:auto;

  }


  .main {

    grid-template-columns:
      1fr;

  }


  .sidebar {

    border-right:0;

    border-bottom:
      1px solid var(--border);

  }


  .workspace {

    height:70vh;

  }

}


</style>

</head>


<body>

<div class="app">


<header class="header">

  <div class="logo">

    <div class="logo-box">
      TB
    </div>

    <div>

      <div class="logo-title">
        Trading Backtester
      </div>

      <div class="logo-sub">
        FX Research & Replay
      </div>

    </div>

  </div>


  <div class="status">

    <span
      id="statusDot"
      class="status-dot"
    ></span>

    <span id="systemStatus">
      Connecting...
    </span>

  </div>

</header>


<main class="main">


<aside class="sidebar">


<!-- =====================================================
     DATA
     ===================================================== -->

<section class="section">

<div class="title">
Market Data
</div>


<div class="data-tabs">

<button
  id="autoTab"
  class="tab active"
>
Automatic
</button>

<button
  id="manualTab"
  class="tab"
>
Manual CSV
</button>

</div>


<div
  id="autoPanel"
  class="data-box"
>


<div class="field">

<label>
FX Pair
</label>

<select id="pair">

<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>NZD/USD</option>

</select>

</div>


<div class="field">

<label>
Data Date Start
</label>

<input
  id="startDate"
  type="date"
>

</div>


<div class="field">

<label>
Data Date End
</label>

<input
  id="endDate"
  type="date"
>

</div>


<div class="field">

<label>
Candles
</label>

<select id="outputsize">

<option value="1000">
1,000
</option>

<option value="2500">
2,500
</option>

<option
  value="5000"
  selected
>
5,000
</option>

</select>

</div>


<button
  id="loadData"
  class="primary"
>
Load Market Data
</button>


<div
  id="dataStatus"
  class="status-box"
>
Select market data and load it.
</div>


</div>


<div
  id="manualPanel"
  class="data-box"
  style="display:none"
>

<input
  id="csv"
  type="file"
  accept=".csv,text/csv"
>


<div
  id="manualStatus"
  class="status-box"
>
CSV remains local.
</div>

</div>

</section>


<!-- =====================================================
     TIMEFRAME
     ===================================================== -->

<section class="section">

<div class="title">
Timeframe
</div>


<div class="tools">

<button
  class="tool tf-btn active"
  data-tf="1"
>
1m
</button>

<button
  class="tool tf-btn"
  data-tf="5"
>
5m
</button>

<button
  class="tool tf-btn"
  data-tf="15"
>
15m
</button>

<button
  class="tool tf-btn"
  data-tf="30"
>
30m
</button>

<button
  class="tool tf-btn"
  data-tf="60"
>
1H
</button>

<button
  class="tool tf-btn"
  data-tf="240"
>
4H
</button>

<button
  class="tool tf-btn"
  data-tf="1440"
>
1D
</button>

</div>

</section>


<!-- =====================================================
     STATS
     ===================================================== -->

<section class="section">

<div class="title">
Backtest
</div>


<div class="stats">

<div class="stat">

<div class="stat-label">
Candles
</div>

<div
  id="candles"
  class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-label">
Position
</div>

<div
  id="position"
  class="stat-value"
>
FLAT
</div>

</div>


<div class="stat">

<div class="stat-label">
Trades
</div>

<div
  id="trades"
  class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-label">
P&L
</div>

<div
  id="pnl"
  class="stat-value"
>
0.00000
</div>

</div>

</div>

</section>


</aside>


<section class="workspace">


<!-- =====================================================
     TOP BAR
     ===================================================== -->

<div class="toolbar">


<button
  id="prev"
  title="Previous candle"
>
◀
</button>


<button
  id="next"
  title="Next candle"
>
▶
</button>


<button
  id="play"
  title="Play replay"
>
▶ Play
</button>


<div class="toolbar-spacer"></div>


<div class="tf-buttons">

<button
  class="tf active"
  data-tf="1"
>
1m
</button>

<button
  class="tf"
  data-tf="5"
>
5m
</button>

<button
  class="tf"
  data-tf="15"
>
15m
</button>

<button
  class="tf"
  data-tf="30"
>
30m
</button>

<button
  class="tf"
  data-tf="60"
>
1H
</button>

<button
  class="tf"
  data-tf="240"
>
4H
</button>

<button
  class="tf"
  data-tf="1440"
>
1D
</button>

</div>


<button
  id="buy"
>
BUY
</button>


<button
  id="sell"
>
SELL
</button>


<button
  id="close"
>
CLOSE
</button>


</div>


<!-- =====================================================
     CHART AREA
     ===================================================== -->

<div
  id="chartArea"
  class="chart-area"
>


<div id="chart"></div>


<!-- =====================================================
     DRAWING TOOLBAR
     ===================================================== -->

<div
  id="drawingToolbar"
  class="drawing-toolbar open"
>


<!-- Cursor -->

<button
  class="drawing-tool active"
  data-tool="cursor"
  data-tooltip="Cursor"
  aria-label="Cursor"
>

<svg viewBox="0 0 24 24">

<path
  d="M5 3l6.8 16 2.2-6 5.8-2.2L5 3z"
></path>

</svg>

</button>


<div class="drawing-divider"></div>


<!-- Horizontal -->

<button
  class="drawing-tool"
  data-tool="horizontal"
  data-tooltip="Horizontal Line"
  aria-label="Horizontal Line"
>

<svg viewBox="0 0 24 24">

<line
  x1="3"
  y1="12"
  x2="21"
  y2="12"
></line>

</svg>

</button>


<!-- Vertical -->

<button
  class="drawing-tool"
  data-tool="vertical"
  data-tooltip="Vertical Line"
  aria-label="Vertical Line"
>

<svg viewBox="0 0 24 24">

<line
  x1="12"
  y1="3"
  x2="12"
  y2="21"
></line>

</svg>

</button>


<!-- Trend -->

<button
  class="drawing-tool"
  data-tool="trend"
  data-tooltip="Trend Line"
  aria-label="Trend Line"
>

<svg viewBox="0 0 24 24">

<line
  x1="4"
  y1="18"
  x2="20"
  y2="6"
></line>

<circle
  cx="4"
  cy="18"
  r="1.5"
></circle>

<circle
  cx="20"
  cy="6"
  r="1.5"
></circle>

</svg>

</button>


<!-- Ray -->

<button
  class="drawing-tool"
  data-tool="ray"
  data-tooltip="Ray"
  aria-label="Ray"
>

<svg viewBox="0 0 24 24">

<line
  x1="4"
  y1="18"
  x2="20"
  y2="6"
></line>

<polyline
  points="15,6 20,6 20,11"
></polyline>

</svg>

</button>


<!-- Rectangle -->

<button
  class="drawing-tool"
  data-tool="rectangle"
  data-tooltip="Rectangle"
  aria-label="Rectangle"
>

<svg viewBox="0 0 24 24">

<rect
  x="4"
  y="5"
  width="16"
  height="14"
></rect>

</svg>

</button>


<!-- Fibonacci -->

<button
  class="drawing-tool"
  data-tool="fib"
  data-tooltip="Fib Retracement"
  aria-label="Fib Retracement"
>

<svg viewBox="0 0 24 24">

<line
  x1="4"
  y1="5"
  x2="20"
  y2="5"
></line>

<line
  x1="4"
  y1="9"
  x2="20"
  y2="9"
></line>

<line
  x1="4"
  y1="13"
  x2="20"
  y2="13"
></line>

<line
  x1="4"
  y1="17"
  x2="20"
  y2="17"
></line>

<line
  x1="4"
  y1="21"
  x2="20"
  y2="21"
></line>

</svg>

</button>


<!-- Measure -->

<button
  class="drawing-tool"
  data-tool="measure"
  data-tooltip="Measure"
  aria-label="Measure"
>

<svg viewBox="0 0 24 24">

<line
  x1="5"
  y1="19"
  x2="19"
  y2="5"
></line>

<line
  x1="5"
  y1="16"
  x2="5"
  y2="22"
></line>

<line
  x1="2"
  y1="19"
  x2="8"
  y2="19"
></line>

<line
  x1="16"
  y1="5"
  x2="22"
  y2="5"
></line>

<line
  x1="19"
  y1="2"
  x2="19"
  y2="8"
></line>

</svg>

</button>


<!-- Arrow -->

<button
  class="drawing-tool"
  data-tool="arrow"
  data-tooltip="Arrow"
  aria-label="Arrow"
>

<svg viewBox="0 0 24 24">

<line
  x1="4"
  y1="20"
  x2="19"
  y2="5"
></line>

<polyline
  points="11,5 19,5 19,13"
></polyline>

</svg>

</button>


<!-- Text -->

<button
  class="drawing-tool"
  data-tool="text"
  data-tooltip="Text"
  aria-label="Text"
>

<svg viewBox="0 0 24 24">

<path
  d="M5 5h14M12 5v14M8 19h8"
></path>

</svg>

</button>


<div class="drawing-divider"></div>


<!-- Undo -->

<button
  id="undoDrawing"
  class="drawing-tool"
  data-tooltip="Undo"
  aria-label="Undo"
>

<svg viewBox="0 0 24 24">

<path
  d="M9 7l-5 5 5 5"
></path>

<path
  d="M4 12h9a6 6 0 0 1 6 6"
></path>

</svg>

</button>


<!-- Clear -->

<button
  id="clearDrawings"
  class="drawing-tool"
  data-tooltip="Clear All Drawings"
  aria-label="Clear All Drawings"
>

<svg viewBox="0 0 24 24">

<path

<script>

"use strict";


/* =========================================================
   STATE
   ========================================================= */

const state = {

  candles: [],

  timeframe: 1,

  currentIndex: -1,

  position: null,

  trades: [],

  pnl: 0,

  playing: false,

  timer: null,

  drawingTool: "cursor",

  drawings: [],

  drawingStart: null,

  drawingPreview: null,

  requestId: 0

};


/* =========================================================
   DOM
   ========================================================= */

const chartArea =
  document.getElementById(
    "chartArea"
  );


const chartElement =
  document.getElementById(
    "chart"
  );


const canvas =
  document.getElementById(
    "drawingCanvas"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


const message =
  document.getElementById(
    "chartMessage"
  );


const drawingToolbar =
  document.getElementById(
    "drawingToolbar"
  );


/* =========================================================
   CHART
   ========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout: {

        background: {
          color:"#080c11"
        },

        textColor:"#8995a5"

      },

      grid: {

        vertLines: {
          color:"#17202a"
        },

        horzLines: {
          color:"#17202a"
        }

      },

      crosshair: {

        mode:
          LightweightCharts
            .CrosshairMode
            .Normal

      },

      rightPriceScale: {

        borderColor:
          "#293443",

        scaleMargins: {

          top:.08,

          bottom:.08

        }

      },

      timeScale: {

        borderColor:
          "#293443",

        timeVisible:true,

        secondsVisible:false,

        rightOffset:8,

        barSpacing:8,

        minBarSpacing:2

      },

      handleScroll: {

        mouseWheel:true,

        pressedMouseMove:true,

        horzTouchDrag:true,

        vertTouchDrag:true

      },

      handleScale: {

        axisPressedMouseMove:true,

        mouseWheel:true,

        pinch:true

      }

    }
  );


const series =
  chart.addCandlestickSeries({

    upColor:"#16a34a",

    downColor:"#dc2626",

    borderUpColor:"#16a34a",

    borderDownColor:"#dc2626",

    wickUpColor:"#16a34a",

    wickDownColor:"#dc2626"

  });


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

  const width =
    chartElement.clientWidth;

  const height =
    chartElement.clientHeight;


  if (
    width <= 0 ||
    height <= 0
  ) {

    return;

  }


  chart.resize(
    width,
    height
  );


  const ratio =
    window.devicePixelRatio ||
    1;


  canvas.width =
    Math.floor(
      chartArea.clientWidth *
      ratio
    );


  canvas.height =
    Math.floor(
      chartArea.clientHeight *
      ratio
    );


  canvas.style.width =
    chartArea.clientWidth +
    "px";


  canvas.style.height =
    chartArea.clientHeight +
    "px";


  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  redrawDrawings();

}


window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   CHART RANGE CHANGED
   ========================================================= */

chart.timeScale()
  .subscribeVisibleTimeRangeChange(
    () => {

      redrawDrawings();

    }
  );


/* =========================================================
   TIMEFRAME MAP
   ========================================================= */

const TIMEFRAME_MAP = {

  1:
    "1min",

  5:
    "5min",

  15:
    "15min",

  30:
    "30min",

  60:
    "1h",

  240:
    "4h",

  1440:
    "1day"

};


/* =========================================================
   TIMEFRAME CHANGE
   ========================================================= */

async function changeTimeframe(
  minutes
) {

  const value =
    Number(minutes);


  if (
    !TIMEFRAME_MAP[value]
  ) {

    return;

  }


  state.timeframe =
    value;


  stopReplay();


  updateTimeframeUI();


  const hasData =
    state.candles.length > 0;


  if (!hasData) {

    return;

  }


  await loadAutomatic(
    value,
    true
  );

}


/* =========================================================
   TIMEFRAME UI
   ========================================================= */

function updateTimeframeUI() {

  document
    .querySelectorAll(
      ".tf-btn,.tf"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.tf
          ) ===
          state.timeframe
        );

      }
    );

}


document
  .querySelectorAll(
    ".tf-btn,.tf"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          changeTimeframe(
            button.dataset.tf
          );

        }
      );

    }
  );


/* =========================================================
   RENDER CHART
   ========================================================= */

function renderChart(
  fit=true
) {

  if (
    !state.candles.length
  ) {

    series.setData([]);

    message.style.display =
      "grid";

    redrawDrawings();

    return;

  }


  message.style.display =
    "none";


  const visible =
    state.candles.slice(
      0,
      state.currentIndex + 1
    );


  series.setData(
    visible
  );


  if (
    fit &&
    visible.length
  ) {

    chart.timeScale()
      .fitContent();

  }


  redrawDrawings();

}


/* =========================================================
   LOAD AUTOMATIC DATA
   ========================================================= */

async function loadAutomatic(
  timeframeOverride=null,
  preserveExisting=false
) {

  const status =
    document.getElementById(
      "dataStatus"
    );


  const loadButton =
    document.getElementById(
      "loadData"
    );


  const timeframe =
    timeframeOverride !== null
      ? Number(timeframeOverride)
      : state.timeframe;


  const interval =
    TIMEFRAME_MAP[timeframe];


  if (!interval) {

    status.textContent =
      "Unsupported timeframe.";

    status.className =
      "status-box error";

    return;

  }


  const pair =
    document.getElementById(
      "pair"
    ).value;


  const outputsize =
    document.getElementById(
      "outputsize"
    ).value;


  const start =
    document.getElementById(
      "startDate"
    ).value;


  const end =
    document.getElementById(
      "endDate"
    ).value;


  const params =
    new URLSearchParams();


  params.set(
    "pair",
    pair
  );


  params.set(
    "interval",
    interval
  );


  params.set(
    "outputsize",
    outputsize
  );


  if (start) {

    params.set(
      "startDate",
      start
    );

  }


  if (end) {

    params.set(
      "endDate",
      end
    );

  }


  const requestId =
    ++state.requestId;


  status.textContent =
    `Loading ${pair} • ${interval}...`;


  status.className =
    "status-box";


  loadButton.disabled =
    true;


  try {

    const response =
      await fetch(
        `/api/fx/base-candles?${params.toString()}`,
        {

          method:"GET",

          headers: {

            Accept:
              "application/json"

          }

        }
      );


    const data =
      await response.json();


    if (
      requestId !==
      state.requestId
    ) {

      return;

    }


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Data request failed."
      );

    }


    if (
      !Array.isArray(
        data.candles
      ) ||
      !data.candles.length
    ) {

      throw new Error(
        "No candle data received."
      );

    }


    state.timeframe =
      timeframe;


    state.candles =
      data.candles;


    state.currentIndex =
      state.candles.length - 1;


    state.position =
      null;


    state.trades =
      [];


    state.pnl =
      0;


    renderChart(true);


    updateStats();

    updateReplay();

    updateTimeframeUI();


    const cacheText =
      data.cached
        ? " • cache"
        : " • fresh";


    status.textContent =
      `${data.pair} • ${data.count.toLocaleString()} candles • ${interval}${cacheText}`;


    status.className =
      "status-box ok";


  } catch (error) {

    console.error(
      error
    );


    if (
      requestId !==
      state.requestId
    ) {

      return;

    }


    status.textContent =
      error.message;


    status.className =
      "status-box error";


  } finally {

    if (
      requestId ===
      state.requestId
    ) {

      loadButton.disabled =
        false;

    }

  }

}


document
  .getElementById(
    "loadData"
  )
  .addEventListener(
    "click",
    () => {

      loadAutomatic();

    }
  );


/* =========================================================
   MANUAL CSV
   ========================================================= */

function parseCSV(
  text
) {

  const lines =
    text
      .replace(/\r/g, "")
      .split("\n")
      .map(
        x =>
          x.trim()
      )
      .filter(Boolean);


  if (
    lines.length < 2
  ) {

    throw new Error(
      "CSV is empty."
    );

  }


  const headers =
    lines[0]
      .split(",")
      .map(
        x =>
          x.trim()
            .toLowerCase()
      );


  const find =
    names => {

      for (
        const name of
        names
      ) {

        const index =
          headers.indexOf(
            name
          );


        if (
          index !== -1
        ) {

          return index;

        }

      }


      return -1;

    };


  const ti =
    find([
      "time",
      "timestamp",
      "datetime",
      "date"
    ]);


  const oi =
    find([
      "open"
    ]);


  const hi =
    find([
      "high"
    ]);


  const li =
    find([
      "low"
    ]);


  const ci =
    find([
      "close"
    ]);


  if (
    ti < 0 ||
    oi < 0 ||
    hi < 0 ||
    li < 0 ||
    ci < 0
  ) {

    throw new Error(
      "CSV requires time, open, high, low and close."
    );

  }


  const result = [];


  for (
    let i = 1;
    i < lines.length;
    i++
  ) {

    const parts =
      lines[i]
        .split(",");


    const timestamp =
      new Date(
        parts[ti]
      ).getTime();


    const open =
      Number(
        parts[oi]
      );


    const high =
      Number(
        parts[hi]
      );


    const low =
      Number(
        parts[li]
      );


    const close =
      Number(
        parts[ci]
      );


    if (
      !Number.isFinite(timestamp) ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ) {

      continue;

    }


    if (
      open <= 0 ||
      high <= 0 ||
      low <= 0 ||
      close <= 0
    ) {

      continue;

    }


    result.push({

      time:
        Math.floor(
          timestamp / 1000
        ),

      open,

      high,

      low,

      close

    });

  }


  result.sort(
    (a,b) =>
      a.time - b.time
  );


  const unique = [];


  let previous =
    null;


  for (
    const candle of
    result
  ) {

    if (
      candle.time ===
      previous
    ) {

      continue;

    }


    unique.push(
      candle
    );


    previous =
      candle.time;

  }


  return unique;

}


document
  .getElementById(
    "csv"
  )
  .addEventListener(
    "change",
    async event => {

      const file =
        event.target.files?.[0];


      if (!file) {

        return;

      }


      try {

        const text =
          await file.text();


        const candles =
          parseCSV(
            text
          );


        if (
          !candles.length
        ) {

          throw new Error(
            "No valid candles found in CSV."
          );

        }


        state.candles =
          candles;


        state.currentIndex =
          candles.length - 1;


        state.position =
          null;


        state.trades =
          [];


        state.pnl =
          0;


        renderChart(true);

        updateStats();

        updateReplay();


        const status =
          document.getElementById(
            "manualStatus"
          );


        status.textContent =
          `${candles.length.toLocaleString()} candles loaded from CSV.`;


        status.className =
          "status-box ok";


      } catch(error) {

        const status =
          document.getElementById(
            "manualStatus"
          );


        status.textContent =
          error.message;


        status.className =
          "status-box error";

      }

    }
  );


/* =========================================================
   REPLAY
   ========================================================= */

function renderReplay() {

  if (
    !state.candles.length
  ) {

    return;

  }


  const visible =
    state.candles.slice(
      0,
      state.currentIndex + 1
    );


  series.setData(
    visible
  );


  updateReplay();

  redrawDrawings();

}


function next() {

  if (
    state.currentIndex <
    state.candles.length - 1
  ) {

    state.currentIndex++;

    renderReplay();

  } else {

    stopReplay();

  }

}


function previous() {

  if (
    state.currentIndex >
    0
  ) {

    state.currentIndex--;

    renderReplay();

  }

}


function startReplay() {

  if (
    state.playing ||
    !state.candles.length
  ) {

    return;

  }


  state.playing =
    true;


  document.getElementById(
    "play"
  ).textContent =
    "⏸ Pause";


  const loop =
    () => {

      if (
        !state.playing
      ) {

        return;

      }


      next();


      if (
        state.playing
      ) {

        state.timer =
          setTimeout(
            loop,
            500
          );

      }

    };


  loop();

}


function stopReplay() {

  state.playing =
    false;


  document.getElementById(
    "play"
  ).textContent =
    "▶ Play";


  if (
    state.timer
  ) {

    clearTimeout(
      state.timer
    );


    state.timer =
      null;

  }

}


document
  .getElementById(
    "next"
  )
  .addEventListener(
    "click",
    next
  );


document
  .getElementById(
    "prev"
  )
  .addEventListener(
    "click",
    previous
  );


document
  .getElementById(
    "play"
  )
  .addEventListener(
    "click",
    () => {

      if (
        state.playing
      ) {

        stopReplay();

      } else {

        startReplay();

      }

    }
  );


/* =========================================================
   TRADING
   ========================================================= */

function currentCandle() {

  return state.candles[
    state.currentIndex
  ];

}


function openPosition(
  side
) {

  const candle =
    currentCandle();


  if (
    !candle ||
    state.position
  ) {

    return;

  }


  state.position = {

    side,

    entry:
      candle.close,

    time:
      candle.time

  };


  updateStats();

}


function closePosition() {

  const candle =
    currentCandle();


  if (
    !candle ||
    !state.position
  ) {

    return;

  }


  const position =
    state.position;


  const direction =
    position.side === "LONG"
      ? 1
      : -1;


  const pnl =
    (
      candle.close -
      position.entry
    ) *
    direction;


  state.pnl +=
    pnl;


  state.trades.push({

    side:
      position.side,

    entry:
      position.entry,

    exit:
      candle.close,

    pnl

  });


  state.position =
    null;


  updateStats();

}


document
  .getElementById(
    "buy"
  )
  .addEventListener(
    "click",
    () =>
      openPosition(
        "LONG"
      )
  );


document
  .getElementById(
    "sell"
  )
  .addEventListener(
    "click",
    () =>
      openPosition(
        "SHORT"
      )
  );


document
  .getElementById(
    "close"
  )
  .addEventListener(
    "click",
    closePosition
  );


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

  document.getElementById(
    "candles"
  ).textContent =
    state.candles.length
      .toLocaleString();


  document.getElementById(
    "position"
  ).textContent =
    state.position
      ? state.position.side
      : "FLAT";


  document.getElementById(
    "trades"
  ).textContent =
    state.trades.length;


  document.getElementById(
    "pnl"
  ).textContent =
    state.pnl.toFixed(5);

}


/* =========================================================
   REPLAY INFO
   ========================================================= */

function updateReplay() {

  if (
    !state.candles.length ||
    state.currentIndex < 0
  ) {

    document.getElementById(
      "replayInfo"
    ).textContent =
      "No data";


    document.getElementById(
      "progressFill"
    ).style.width =
      "0%";


    return;

  }


  const candle =
    state.candles[
      state.currentIndex
    ];


  if (!candle) {

    return;

  }


  const date =
    new Date(
      candle.time * 1000
    );


  document.getElementById(
    "replayInfo"
  ).textContent =
    `${state.currentIndex + 1} / ${state.candles.length.toLocaleString()} • ${date.toLocaleString()}`;


  const percent =
    state.candles.length > 1
      ? (
          state.currentIndex /
          (state.candles.length - 1)
        ) *
        100
      : 100;


  document.getElementById(
    "progressFill"
  ).style.width =
    `${percent}%`;

}


/* =========================================================
   DRAWING INTERACTION ENGINE
   ========================================================= */

const TWO_POINT_TOOLS = new Set([
  "trend",
  "ray",
  "rectangle",
  "fib",
  "measure",
  "arrow"
]);

function coordinateToTime(x) {
  const value = chart.timeScale().coordinateToTime(x);

  if (value === null || value === undefined) return null;

  if (typeof value === "object") {
    if ("timestamp" in value) return Number(value.timestamp);
    if ("year" in value) {
      return Math.floor(Date.UTC(
        value.year,
        value.month - 1,
        value.day
      ) / 1000);
    }
  }

  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function coordinateToPrice(y) {
  const value = series.coordinateToPrice(y);
  return Number.isFinite(value) ? value : null;
}

function timeToX(time) {
  const value = chart.timeScale().timeToCoordinate(time);
  return value === null ? null : value;
}

function priceToY(price) {
  const value = series.priceToCoordinate(price);
  return value === null ? null : value;
}

function getPointerPosition(event) {
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const time = coordinateToTime(x);
  const price = coordinateToPrice(y);

  if (time === null || price === null) return null;

  return { x, y, time, price };
}

function resetDrawingInteraction() {
  state.drawingStart = null;
  state.drawingPreview = null;
  redrawDrawings();
}

function createDrawingFromPoints(start, end) {
  const type = state.drawingTool;
  const drawing = {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    type,
    t1: start.time,
    p1: start.price,
    t2: end.time,
    p2: end.price
  };

  if (type === "horizontal") {
    drawing.t2 = drawing.t1;
    drawing.p2 = drawing.p1;
  }

  if (type === "vertical") {
    drawing.t2 = drawing.t1;
    drawing.p2 = drawing.p1;
  }

  if (type === "text") {
    const text = window.prompt("Enter text:");
    if (!text || !text.trim()) return null;
    drawing.text = text.trim();
    drawing.t2 = drawing.t1;
    drawing.p2 = drawing.p1;
  }

  return drawing;
}

function commitTwoPointDrawing(end) {
  if (!state.drawingStart) return;

  const start = state.drawingStart;
  const distance = Math.hypot(
    end.x - start.x,
    end.y - start.y
  );

  if (distance < 5) {
    resetDrawingInteraction();
    return;
  }

  const drawing = createDrawingFromPoints(start, end);

  if (drawing) {
    state.drawings.push(drawing);
  }

  resetDrawingInteraction();
}

function setDrawingTool(tool) {
  state.drawingTool = tool;

  document.querySelectorAll(".drawing-tool[data-tool]").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.tool === tool
    );
  });

  canvas.style.pointerEvents = tool === "cursor" ? "none" : "auto";
  canvas.style.cursor = tool === "cursor" ? "default" : "crosshair";

  resetDrawingInteraction();
}

document.querySelectorAll(".drawing-tool[data-tool]").forEach(button => {
  button.addEventListener("click", event => {
    event.stopPropagation();
    setDrawingTool(button.dataset.tool);
  });
});

canvas.addEventListener("pointerdown", event => {
  if (state.drawingTool === "cursor") return;

  const point = getPointerPosition(event);
  if (!point) return;

  event.preventDefault();
  canvas.setPointerCapture?.(event.pointerId);

  if (
    state.drawingTool === "horizontal" ||
    state.drawingTool === "vertical" ||
    state.drawingTool === "text"
  ) {
    const drawing = createDrawingFromPoints(point, point);
    if (drawing) state.drawings.push(drawing);
    resetDrawingInteraction();
    return;
  }

  state.drawingStart = point;
  state.drawingPreview = {
    type: state.drawingTool,
    t1: point.time,
    p1: point.price,
    t2: point.time,
    p2: point.price
  };
  redrawDrawings();
});

canvas.addEventListener("pointermove", event => {
  if (!state.drawingStart) return;

  const point = getPointerPosition(event);
  if (!point) return;

  state.drawingPreview = {
    type: state.drawingTool,
    t1: state.drawingStart.time,
    p1: state.drawingStart.price,
    t2: point.time,
    p2: point.price
  };

  redrawDrawings();
});

canvas.addEventListener("pointerup", event => {
  if (!state.drawingStart) return;

  const point = getPointerPosition(event);
  if (!point) {
    resetDrawingInteraction();
    return;
  }

  commitTwoPointDrawing(point);
});

canvas.addEventListener("pointercancel", resetDrawingInteraction);

/* =========================================================
   DRAWING TOOLBAR COLLAPSE
   ========================================================= */

document.getElementById("drawingCollapse").addEventListener("click", event => {
  event.stopPropagation();
  drawingToolbar.classList.toggle("collapsed");
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    resetDrawingInteraction();
    setDrawingTool("cursor");
  }

  if (
    (event.key === "Delete" || event.key === "Backspace") &&
    state.drawingTool !== "cursor"
  ) {
    if (state.drawings.length) {
      state.drawings.pop();
      resetDrawingInteraction();
    }
  }
});

/* =========================================================
   DRAWINGS REDRAW
   ========================================================= */

function redrawDrawings() {

  const width =
    chartArea.clientWidth;


  const height =
    chartArea.clientHeight;


  if (
    width <= 0 ||
    height <= 0
  ) {

    return;

  }


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  for (
    const drawing of
    state.drawings
  ) {

    drawObject(
      drawing,
      false
    );

  }


  if (
    state.drawingPreview
  ) {

    drawObject(
      state.drawingPreview,
      true
    );

  }

}


/* =========================================================
   DRAW OBJECT
   ========================================================= */

function drawObject(
  d,
  preview=false
) {

  const x1 =
    timeToX(
      d.t1
    );


  const y1 =
    priceToY(
      d.p1
    );


  const x2 =
    timeToX(
      d.t2
    );


  const y2 =
    priceToY(
      d.p2
    );


  if (
    x1 === null ||
    y1 === null
  ) {

    return;

  }


  ctx.save();


  ctx.lineWidth =
    preview
      ? 1.4
      : 1.7;


  ctx.strokeStyle =
    preview
      ? "#7d9cff"
      : "#d7dee8";


  ctx.fillStyle =
    "rgba(41,98,255,.10)";


  ctx.setLineDash(
    []
  );


  /* =====================================================
     HORIZONTAL
     ===================================================== */

  if (
    d.type ===
    "horizontal"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      0,
      y1
    );

    ctx.lineTo(
      chartArea.clientWidth,
      y1
    );

    ctx.stroke();

  }


  /* =====================================================
     VERTICAL
     ===================================================== */

  else if (
    d.type ===
    "vertical"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x1,
      0
    );

    ctx.lineTo(
      x1,
      chartArea.clientHeight
    );

    ctx.stroke();

  }


  /* =====================================================
     TREND
     ===================================================== */

  else if (
    d.type ===
    "trend"
  ) {

    if (
      x2 === null ||
      y2 === null
    ) {

      ctx.restore();

      return;

    }


    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.stroke();


    drawPointHandle(
      x1,
      y1,
      preview
    );


    drawPointHandle(
      x2,
      y2,
      preview
    );

  }


  /* =====================================================
     RAY
     ===================================================== */

  else if (
    d.type ===
    "ray"
  ) {

    if (
      x2 === null ||
      y2 === null
    ) {

      ctx.restore();

      return;

    }


    const dx =
      x2 - x1;


    const dy =
      y2 - y1;


    if (
      Math.abs(dx) < .0001
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x1,
        y1
      );

      ctx.lineTo(
        x1,
        chartArea.clientHeight
      );

      ctx.stroke();

    } else {

      let endX;

      let endY;


      if (
        dx > 0
      ) {

        endX =
          chartArea.clientWidth;

      } else {

        endX =
          0;

      }


      endY =
        y1 +
        (
          endX -
          x1
        ) *
        (
          dy /
          dx
        );


      ctx.beginPath();

      ctx.moveTo(
        x1,
        y1
      );

      ctx.lineTo(
        endX,
        endY
      );

      ctx.stroke();

    }

  }


  /* =====================================================
     RECTANGLE
     ===================================================== */

  else if (
    d.type ===
    "rectangle"
  ) {

    if (
      x2 === null ||
      y2 === null
    ) {

      ctx.restore();

      return;

    }


    const left =
      Math.min(
        x1,
        x2
      );


    const top =
      Math.min(
        y1,
        y2
      );


    const width =
      Math.abs(
        x2 - x1
      );


    const height =
      Math.abs(
        y2 - y1
      );


    ctx.fillStyle =
      preview
        ? "rgba(41,98,255,.07)"
        : "rgba(41,98,255,.10)";


    ctx.fillRect(
      left,
      top,
      width,
      height
    );


    ctx.strokeRect(
      left,
      top,
      width,
      height
    );

  }


  /* =====================================================
     FIBONACCI
     ===================================================== */

  else if (
    d.type ===
    "fib"
  ) {

    if (
      x2 === null ||
      y2 === null
    ) {

      ctx.restore();

      return;

    }


    const levels = [

      0,

      .236,

      .382,

      .5,

      .618,

      .786,

      1

    ];


    const left =
      Math.min(
        x1,
        x2
      );


    const right =
      Math.max(
        x1,
        x2
      );


    for (
      const level of
      levels
    ) {

      const price =
        d.p1 +
        (
          d.p2 -
          d.p1
        ) *
        level;


      const y =
        priceToY(
          price
        );


      if (
        y === null
      ) {

        continue;

      }


      ctx.beginPath();

      ctx.moveTo(
        left,
        y
      );

      ctx.lineTo(
        right,
        y
      );

      ctx.stroke();


      ctx.fillStyle =
        "#aeb8c6";


      ctx.font =
        "10px Arial";


      ctx.fillText(
        `${(
          level * 100
        ).toFixed(1)}%`,
        left + 4,
        y - 4
      );

    }

  }


  /* =====================================================
     MEASURE
     ===================================================== */

  else if (
    d.type ===
    "measure"
  ) {

    if (
      x2 === null ||
      y2 === null
    ) {

      ctx.restore();

      return;

    }


    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.stroke();


    const change =
      d.p1 !== 0
        ? (
            (
              d.p2 -
              d.p1
            ) /
            d.p1
          ) *
          100
        : 0;


    const distance =
      Math.abs(
        d.t2 -
        d.t1
      );


    const hours =
      distance /
      3600;


    const bars =
      estimateBars(
        d.t1,
        d.t2
      );


    ctx.fillStyle =
      "#e0e6ef";


    ctx.font =
      "11px Arial";


    const text =
      `${change >= 0 ? "+" : ""}${change.toFixed(2)}% • ${hours.toFixed(2)}h • ${bars} bars`;


    const labelX =
      x2 + 7;


    const labelY =
      y2 - 7;


    ctx.fillText(
      text,
      labelX,
      labelY
    );

  }


  /* =====================================================
     ARROW
     ===================================================== */

  else if (
    d.type ===
    "arrow"
  ) {

    if (
      x2 === null ||
      y2 === null
    ) {

      ctx.restore();

      return;

    }


    drawArrow(
      x1,
      y1,
      x2,
      y2
    );

  }


  /* =====================================================
     TEXT
     ===================================================== */

  else if (
    d.type ===
    "text"
  ) {

    ctx.fillStyle =
      "#e8edf4";


    ctx.font =
      "13px Arial";


    ctx.fillText(
      d.text ||
      "Text",
      x1,
      y1
    );

  }


  ctx.restore();

}


/* =========================================================
   POINT HANDLE
   ========================================================= */

function drawPointHandle(
  x,
  y,
  preview
) {

  ctx.save();


  ctx.fillStyle =
    preview
      ? "#7d9cff"
      : "#d7dee8";


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    2.5,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.restore();

}


/* =========================================================
   ARROW DRAWING
   ========================================================= */

function drawArrow(
  x1,
  y1,
  x2,
  y2
) {

  const angle =
    Math.atan2(
      y2 - y1,
      x2 - x1
    );


  const size =
    9;


  ctx.beginPath();

  ctx.moveTo(
    x1,
    y1
  );

  ctx.lineTo(
    x2,
    y2
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x2,
    y2
  );


  ctx.lineTo(
    x2 -
      size *
      Math.cos(
        angle -
        Math.PI / 6
      ),

    y2 -
      size *
      Math.sin(
        angle -
        Math.PI / 6
      )
  );


  ctx.lineTo(
    x2 -
      size *
      Math.cos(
        angle +
        Math.PI / 6
      ),

    y2 -
      size *
      Math.sin(
        angle +
        Math.PI / 6
      )
  );


  ctx.closePath();


  ctx.fillStyle =
    ctx.strokeStyle;


  ctx.fill();

}


/* =========================================================
   ESTIMATE BARS
   ========================================================= */

function estimateBars(
  t1,
  t2
) {

  if (
    !state.candles.length
  ) {

    return 0;

  }


  const distance =
    Math.abs(
      t2 -
      t1
    );


  if (
    distance <= 0
  ) {

    return 0;

  }


  const intervalMinutes =
    state.timeframe;


  const secondsPerBar =
    intervalMinutes *
    60;


  return Math.round(
    distance /
    secondsPerBar
  );

}


/* =========================================================
   UNDO
   ========================================================= */

document
  .getElementById(
    "undoDrawing"
  )
  .addEventListener(
    "click",
    event => {

      event.stopPropagation();


      if (
        state.drawings.length
      ) {

        state.drawings.pop();

      }


      state.drawingStart =
        null;


      state.drawingPreview =
        null;


      redrawDrawings();

    }
  );


/* =========================================================
   CLEAR DRAWINGS
   ========================================================= */

document
  .getElementById(
    "clearDrawings"
  )
  .addEventListener(
    "click",
    event => {

      event.stopPropagation();


      state.drawings =
        [];


      state.drawingStart =
        null;


      state.drawingPreview =
        null;


      redrawDrawings();

    }
  );


/* =========================================================
   TABS
   ========================================================= */

document
  .getElementById(
    "autoTab"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "autoTab"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "manualTab"
        )
        .classList.remove(
          "active"
        );


      document
        .getElementById(
          "autoPanel"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "manualPanel"
        )
        .style.display =
        "none";

    }
  );


document
  .getElementById(
    "manualTab"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "manualTab"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "autoTab"
        )
        .classList.remove(
          "active"
        );


      document
        .getElementById(
          "autoPanel"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "manualPanel"
        )
        .style.display =
        "block";

    }
  );


/* =========================================================
   HEALTH
   ========================================================= */

async function health() {

  try {

    const response =
      await fetch(
        "/api/health"
      );


    const data =
      await response.json();


    const status =
      document.getElementById(
        "systemStatus"
      );


    const dot =
      document.getElementById(
        "statusDot"
      );


    if (
      data.ok &&
      data.automaticData
    ) {

      status.textContent =
        "Automatic FX data online";


      dot.style.background =
        "#16a34a";

    } else {

      status.textContent =
        "Manual mode";


      dot.style.background =
        "#f59e0b";

    }

  } catch {

    document.getElementById(
      "systemStatus"
    ).textContent =
      "Backend unavailable";


    document.getElementById(
      "statusDot"
    ).style.background =
      "#dc2626";

  }

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    const tag =
      event.target?.tagName;


    if (
      tag === "INPUT" ||
      tag === "SELECT" ||
      tag === "TEXTAREA"
    ) {

      return;

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      next();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      previous();

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();


      if (
        state.playing
      ) {

        stopReplay();

      } else {

        startReplay();

      }

    }


    if (
      event.key ===
      "Escape"
    ) {

      setDrawingTool(
        "cursor"
      );

    }

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

setDrawingTool(
  "cursor"
);


updateTimeframeUI();

updateStats();

updateReplay();

health();

resize();


/* =========================================================
   AUTO LOAD
   ========================================================= */

loadAutomatic();


</script>

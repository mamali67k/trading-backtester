<!DOCTYPE html>
<html>
<head>
    <title>Trading Backtester</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; }
        #chart { width: 100%; height: 500px; border: 1px solid #ccc; }
        .controls { margin-top: 10px; }
    </style>
</head>
<body>
    <h2>ابزار بکتست ساده</h2>
    <input type="file" id="csvFile" accept=".csv" />
    <div id="chart"></div>
    <div class="controls">
        <button onclick="startReplay()">شروع پخش</button>
    </div>

    <script>
        const chart = LightweightCharts.createChart(document.getElementById('chart'), { width: 800, height: 500 });
        const candleSeries = chart.addCandlestickSeries();

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                console.log("فایل لود شد، آماده پردازش...");
                // اینجا کدهای پردازش CSV شما قرار می‌گیرد
                alert("فایل لود شد!");
            };
            reader.readAsText(file);
        });

        function startReplay() {
            alert("قابلیت پخش به زودی فعال می‌شود");
        }
    </script>
</body>
</html>

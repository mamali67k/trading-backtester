<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Professional FX Trading Backtester"
  >

  <title>Trading Backtester</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #111720;
      --panel2: #151d28;
      --border: #273241;
      --text: #e7edf5;
      --muted: #8c98a8;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-rows: 64px 1fr;
      width: 100vw;
      height: 100vh;
    }

    /*
    |--------------------------------------------------------------------------
    | Header
    |--------------------------------------------------------------------------
    */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: #0d1219;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    /*
    |--------------------------------------------------------------------------
    | Main layout
    |--------------------------------------------------------------------------
    */

    .main {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 0;
    }

    /*
    |--------------------------------------------------------------------------
    | Sidebar
    |--------------------------------------------------------------------------
    */

    .sidebar {
      min-width: 0;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 16px;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .data-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--muted);
      padding: 9px;
      border-radius: 7px;
      font-size: 12px;
    }

    .tab.active {
      color: white;
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.12);
    }

    .data-panel {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      background: #0e141c;
    }

    .field {
      margin-bottom: 11px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    select,
    input[type="date"],
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #0a0f15;
      color: var(--text);
      padding: 9px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: var(--accent);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 10px 12px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      margin-top: 10px;
    }

    .primary-btn:hover {
      filter: brightness(1.08);
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 12px;
      background: var(--panel2);
      color: var(--text);
      margin-top: 8px;
    }

    .drop-zone {
      border: 1px dashed #3a4655;
      border-radius: 8px;
      padding: 18px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      transition: 0.15s ease;
    }

    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.08);
    }

    .data-status {
      margin-top: 10px;
      padding: 9px;
      border-radius: 7px;
      background: #0a0f15;
      border: 1px solid var(--border);
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
    }

    .data-status.success {
      color: #9be7b0;
      border-color: rgba(34, 197, 94, 0.3);
    }

    .data-status.error {
      color: #ffb4b4;
      border-color: rgba(239, 68, 68, 0.3);
    }

    /*
    |--------------------------------------------------------------------------
    | Stats
    |--------------------------------------------------------------------------
    */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .stat {
      padding: 10px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 10px;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 700;
    }

    /*
    |--------------------------------------------------------------------------
    | Workspace
    |--------------------------------------------------------------------------
    */

    .workspace {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr) 58px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      background: #0d1219;
    }

    .toolbar button {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel2);
      color: var(--text);
      padding: 7px 11px;
      font-size: 11px;
    }

    .toolbar button:hover {
      border-color: #465467;
    }

    .toolbar .buy {
      color: #8df0a9;
    }

    .toolbar .sell {
      color: #ff9b9b;
    }

    .toolbar .close {
      color: #f5c66a;
    }

    .toolbar-spacer {
      flex: 1;
    }

    .speed {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .speed select {
      width: auto;
      padding: 6px 8px;
    }

    /*
    |--------------------------------------------------------------------------
    | Chart
    |--------------------------------------------------------------------------
    */

    .chart-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #0a0f15;
    }

    #chart {
      position: absolute;
      inset: 0;
    }

    .chart-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: var(--muted);
      font-size: 13px;
    }

    /*
    |--------------------------------------------------------------------------
    | Replay footer
    |--------------------------------------------------------------------------
    */

    .replay-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: #0d1219;
    }

    .replay-info {
      color: var(--muted);
      font-size: 11px;
    }

    .replay-progress {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: #26303c;
      overflow: hidden;
    }

    .replay-progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
    }

    /*
    |--------------------------------------------------------------------------
    | Responsive
    |--------------------------------------------------------------------------
    */

    @media (max-width: 850px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .workspace {
        height: 70vh;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="brand-mark">
        TB
      </div>

      <div>
        <div class="brand-title">
          Trading Backtester
        </div>

        <div class="brand-subtitle">
          FX Research & Replay Platform
        </div>
      </div>

    </div>

    <div class="system-status">

      <span class="status-dot"></span>

      <span id="systemStatus">
        Checking system...
      </span>

    </div>

  </header>


  <!-- MAIN -->

  <main class="main">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <!-- DATA -->

      <section class="section">

        <div class="section-title">
          Market Data
        </div>

        <div class="data-tabs">

          <button
            id="automaticTab"
            class="tab active"
            type="button"
          >
            Automatic
          </button>

          <button
            id="manualTab"
            class="tab"
            type="button"
          >
            Manual CSV
          </button>

        </div>


        <!-- AUTOMATIC -->

        <div
          id="automaticPanel"
          class="data-panel"
        >

          <div class="field">

            <label>
              FX Pair
            </label>

            <select id="pair">

              <option value="EUR/USD">
                EUR/USD
              </option>

              <option value="GBP/USD">
                GBP/USD
              </option>

              <option value="USD/JPY">
                USD/JPY
              </option>

              <option value="USD/CHF">
                USD/CHF
              </option>

              <option value="AUD/USD">
                AUD/USD
              </option>

              <option value="USD/CAD">
                USD/CAD
              </option>

              <option value="NZD/USD">
                NZD/USD
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Timeframe
            </label>

            <select id="interval">

              <option value="1min">
                1 Minute
              </option>

              <option value="5min">
                5 Minutes
              </option>

              <option value="15min">
                15 Minutes
              </option>

              <option value="30min">
                30 Minutes
              </option>

              <option value="1h" selected>
                1 Hour
              </option>

              <option value="4h">
                4 Hours
              </option>

              <option value="1day">
                1 Day
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Start Date
            </label>

            <input
              id="startDate"
              type="date"
            >

          </div>


          <div class="field">

            <label>
              End Date
            </label>

            <input
              id="endDate"
              type="date"
            >

          </div>


          <div class="field">

            <label>
              Maximum candles
            </label>

            <select id="outputsize">

              <option value="500">
                500
              </option>

              <option value="1000">
                1,000
              </option>

              <option value="2500">
                2,500
              </option>

              <option value="5000" selected>
                5,000
              </option>

            </select>

          </div>


          <button
            id="fetchAutomatic"
            class="primary-btn"
            type="button"
          >
            Fetch Market Data
          </button>


          <div
            id="automaticStatus"
            class="data-status"
          >
            Ready.
          </div>

        </div>


        <!-- MANUAL -->

        <div
          id="manualPanel"
          class="data-panel"
          style="display:none"
        >

          <div
            id="dropZone"
            class="drop-zone"
          >

            Drop CSV file here

            <br>

            or

            <br><br>

            <input
              id="csvFile"
              type="file"
              accept=".csv,text/csv"
            >

          </div>


          <div
            id="manualStatus"
            class="data-status"
          >
            CSV stays in your browser.
          </div>

        </div>

      </section>


      <!-- STATS -->

      <section class="section">

        <div class="section-title">
          Backtest Statistics
        </div>

        <div class="stats">

          <div class="stat">

            <div class="stat-label">
              Candles
            </div>

            <div
              id="statCandles"
              class="stat-value"
            >
              0
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Position
            </div>

            <div
              id="statPosition"
              class="stat-value"
            >
              FLAT
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Trades
            </div>

            <div
              id="statTrades"
              class="stat-value"
            >
              0
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              P&L
            </div>

            <div
              id="statPnl"
              class="stat-value"
            >
              0.00
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Win Rate
            </div>

            <div
              id="statWinRate"
              class="stat-value"
            >
              0%
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Max DD
            </div>

            <div
              id="statDrawdown"
              class="stat-value"
            >
              0.00
            </div>

          </div>

        </div>

      </section>

    </aside>


    <!-- WORKSPACE -->

    <section class="workspace">

      <div class="toolbar">

        <button
          id="previousCandle"
          type="button"
        >
          ◀ Previous
        </button>

        <button
          id="nextCandle"
          type="button"
        >
          Next ▶
        </button>

        <button
          id="playReplay"
          type="button"
        >
          ▶ Play
        </button>

        <div class="toolbar-spacer"></div>

        <div class="speed">

          Speed

          <select id="speed">

            <option value="2000">
              1x
            </option>

            <option value="1000">
              2x
            </option>

            <option value="500">
              4x
            </option>

            <option value="250">
              8x
            </option>

            <option value="100">
              20x
            </option>

          </select>

        </div>

        <button
          id="buy"
          class="buy"
          type="button"
        >
          BUY
        </button>

        <button
          id="sell"
          class="sell"
          type="button"
        >
          SELL
        </button>

        <button
          id="closePosition"
          class="close"
          type="button"
        >
          CLOSE
        </button>

      </div>


      <div class="chart-wrap">

        <div id="chart"></div>

        <div
          id="chartEmpty"
          class="chart-empty"
        >
          Load market data to begin.
        </div>

      </div>


      <div class="replay-bar">

        <div
          id="replayInfo"
          class="replay-info"
        >
          No data
        </div>

        <div class="replay-progress">

          <div
            id="replayProgressFill"
            class="replay-progress-fill"
          ></div>

        </div>

      </div>

    </section>

  </main>

</div>


<script>
"use strict";

/*
|--------------------------------------------------------------------------
| Application state
|--------------------------------------------------------------------------
*/

const state = {
  candles: [],
  visibleCandles: [],
  currentIndex: -1,

  position: null,

  trades: [],

  realizedPnl: 0,

  equity: 0,

  peakEquity: 0,

  maxDrawdown: 0,

  isPlaying: false,

  playTimer: null
};


/*
|--------------------------------------------------------------------------
| DOM
|--------------------------------------------------------------------------
*/

const chartElement =
  document.getElementById("chart");

const chartEmpty =
  document.getElementById("chartEmpty");

const automaticTab =
  document.getElementById("automaticTab");

const manualTab =
  document.getElementById("manualTab");

const automaticPanel =
  document.getElementById("automaticPanel");

const manualPanel =
  document.getElementById("manualPanel");

const pair =
  document.getElementById("pair");

const interval =
  document.getElementById("interval");

const startDate =
  document.getElementById("startDate");

const endDate =
  document.getElementById("endDate");

const outputsize =
  document.getElementById("outputsize");

const fetchAutomatic =
  document.getElementById("fetchAutomatic");

const automaticStatus =
  document.getElementById("automaticStatus");

const csvFile =
  document.getElementById("csvFile");

const dropZone =
  document.getElementById("dropZone");

const manualStatus =
  document.getElementById("manualStatus");

const previousCandle =
  document.getElementById("previousCandle");

const nextCandle =
  document.getElementById("nextCandle");

const playReplay =
  document.getElementById("playReplay");

const speed =
  document.getElementById("speed");

const buy =
  document.getElementById("buy");

const sell =
  document.getElementById("sell");

const closePosition =
  document.getElementById("closePosition");

const chart =
  LightweightCharts.createChart(
    chartElement,
    {
      layout: {
        background: {
          color: "#0a0f15"
        },

        textColor: "#9aa6b2"
      },

      grid: {
        vertLines: {
          color: "#18212b"
        },

        horzLines: {
          color: "#18212b"
        }
      },

      rightPriceScale: {
        borderColor: "#273241"
      },

      timeScale: {
        borderColor: "#273241",
        timeVisible: true,
        secondsVisible: false
      },

      crosshair: {
        mode:
          LightweightCharts.CrosshairMode.Normal
      }
    }
  );


const candleSeries =
  chart.addCandlestickSeries({
    upColor: "#22c55e",
    downColor: "#ef4444",
    borderUpColor: "#22c55e",
    borderDownColor: "#ef4444",
    wickUpColor: "#22c55e",
    wickDownColor: "#ef4444"
  });


/*
|--------------------------------------------------------------------------
| Resize
|--------------------------------------------------------------------------
*/

function resizeChart() {

  chart.applyOptions({
    width: chartElement.clientWidth,
    height: chartElement.clientHeight
  });

}

window.addEventListener(
  "resize",
  resizeChart
);

resizeChart();


/*
|--------------------------------------------------------------------------
| Tabs
|--------------------------------------------------------------------------
*/

automaticTab.addEventListener(
  "click",
  () => {

    automaticTab.classList.add("active");
    manualTab.classList.remove("active");

    automaticPanel.style.display = "block";
    manualPanel.style.display = "none";

  }
);


manualTab.addEventListener(
  "click",
  () => {

    manualTab.classList.add("active");
    automaticTab.classList.remove("active");

    manualPanel.style.display = "block";
    automaticPanel.style.display = "none";

  }
);


/*
|--------------------------------------------------------------------------
| Status helpers
|--------------------------------------------------------------------------
*/

function setAutomaticStatus(
  message,
  type = ""
) {

  automaticStatus.textContent = message;

  automaticStatus.className =
    "data-status";

  if (type) {
    automaticStatus.classList.add(type);
  }

}


function setManualStatus(
  message,
  type = ""
) {

  manualStatus.textContent = message;

  manualStatus.className =
    "data-status";

  if (type) {
    manualStatus.classList.add(type);
  }

}


/*
|--------------------------------------------------------------------------
| System health
|--------------------------------------------------------------------------
*/

async function checkSystem() {

  const status =
    document.getElementById("systemStatus");

  try {

    const response =
      await fetch("/api/health");

    const data =
      await response.json();

    if (
      response.ok &&
      data.ok
    ) {

      if (data.automaticData) {

        status.textContent =
          "Automatic FX data online";

      } else {

        status.textContent =
          "Manual data mode";

      }

    } else {

      status.textContent =
        "System unavailable";

    }

  } catch (error) {

    status.textContent =
      "Backend unavailable";

  }

}

checkSystem();


/*
|--------------------------------------------------------------------------
| Fetch automatic data
|--------------------------------------------------------------------------
*/

async function loadAutomaticData() {

  setAutomaticStatus(
    "Requesting market data...",
    ""
  );

  fetchAutomatic.disabled = true;

  try {

    const params =
      new URLSearchParams();

    params.set(
      "pair",
      pair.value
    );

    params.set(
      "interval",
      interval.value
    );

    params.set(
      "outputsize",
      outputsize.value
    );

    if (startDate.value) {

      params.set(
        "startDate",
        startDate.value
      );

    }

    if (endDate.value) {

      params.set(
        "endDate",
        endDate.value
      );

    }

    const response =
      await fetch(
        `/api/fx/candles?${params.toString()}`
      );

    const data =
      await response.json();

    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Unable to load market data."
      );

    }

    if (
      !Array.isArray(data.candles) ||
      !data.candles.length
    ) {

      throw new Error(
        "No valid candles received."
      );

    }

    loadCandles(
      data.candles
    );

    const cacheText =
      data.cached
        ? " • cached"
        : "";

    setAutomaticStatus(
      `${data.pair} • ${data.interval} • ${data.count.toLocaleString()} candles${cacheText}`,
      "success"
    );

  } catch (error) {

    console.error(error);

    setAutomaticStatus(
      error.message ||
      "Automatic data request failed.",
      "error"
    );

  } finally {

    fetchAutomatic.disabled = false;

  }

}


fetchAutomatic.addEventListener(
  "click",
  loadAutomaticData
);


/*
|--------------------------------------------------------------------------
| CSV parser
|--------------------------------------------------------------------------
*/

function parseCSV(text) {

  const lines =
    text
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .split("\n")
      .map(
        line => line.trim()
      )
      .filter(Boolean);

  if (lines.length < 2) {

    throw new Error(
      "CSV file does not contain enough rows."
    );

  }

  const headers =
    lines[0]
      .split(",")
      .map(
        x => x.trim().toLowerCase()
      );

  function findHeader(names) {

    for (const name of names) {

      const index =
        headers.indexOf(name);

      if (index !== -1) {
        return index;
      }

    }

    return -1;
  }

  const timeIndex =
    findHeader([
      "time",
      "timestamp",
      "datetime",
      "date"
    ]);

  const openIndex =
    findHeader(["open"]);

  const highIndex =
    findHeader(["high"]);

  const lowIndex =
    findHeader(["low"]);

  const closeIndex =
    findHeader(["close"]);

  if (
    timeIndex === -1 ||
    openIndex === -1 ||
    highIndex === -1 ||
    lowIndex === -1 ||
    closeIndex === -1
  ) {

    throw new Error(
      "CSV must contain time, open, high, low and close columns."
    );

  }

  const result = [];

  for (
    let i = 1;
    i < lines.length;
    i++
  ) {

    const parts =
      lines[i].split(",");

    const timestamp =
      new Date(
        parts[timeIndex]
      ).getTime();

    const open =
      Number(parts[openIndex]);

    const high =
      Number(parts[highIndex]);

    const low =
      Number(parts[lowIndex]);

    const close =
      Number(parts[closeIndex]);

    if (
      !Number.isFinite(timestamp) ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ) {
      continue;
    }

    if (
      high < low ||
      open > high ||
      open < low ||
      close > high ||
      close < low
    ) {
      continue;
    }

    result.push({
      time: Math.floor(
        timestamp / 1000
      ),
      open,
      high,
      low,
      close
    });

  }

  result.sort(
    (a, b) =>
      a.time - b.time
  );

  const unique = [];

  let lastTime = null;

  for (const candle of result) {

    if (
      candle.time === lastTime
    ) {
      continue;
    }

    unique.push(candle);

    lastTime = candle.time;

  }

  return unique;

}


/*
|--------------------------------------------------------------------------
| CSV loading
|--------------------------------------------------------------------------
*/

async function loadCSVFile(file) {

  if (!file) {
    return;
  }

  if (
    file.size >
    25 * 1024 * 1024
  ) {

    setManualStatus(
      "CSV file is larger than 25 MB.",
      "error"
    );

    return;

  }

  try {

    const text =
      await file.text();

    const candles =
      parseCSV(text);

    if (!candles.length) {

      throw new Error(
        "No valid OHLC candles found."
      );

    }

    if (
      candles.length > 200000
    ) {

      throw new Error(
        "Maximum supported rows: 200,000."
      );

    }

    loadCandles(candles);

    setManualStatus(
      `${candles.length.toLocaleString()} candles loaded successfully.`,
      "success"
    );

  } catch (error) {

    console.error(error);

    setManualStatus(
      error.message ||
      "CSV import failed.",
      "error"
    );

  }

}


csvFile.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0];

    loadCSVFile(file);

  }
);


/*
|--------------------------------------------------------------------------
| Drag & drop
|--------------------------------------------------------------------------
*/

dropZone.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    dropZone.classList.add(
      "dragover"
    );

  }
);

dropZone.addEventListener(
  "dragleave",
  () => {

    dropZone.classList.remove(
      "dragover"
    );

  }
);

dropZone.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    dropZone.classList.remove(
      "dragover"
    );

    const file =
      event.dataTransfer.files?.[0];

    if (!file) {
      return;
    }

    loadCSVFile(file);

  }
);


/*
|--------------------------------------------------------------------------
| Load candles
|--------------------------------------------------------------------------
*/

function loadCandles(candles) {

  stopReplay();

  state.candles =
    candles.map(c => ({
      time: c.time,
      open: c.open,
      high: c.high,
      low: c.low,
      close: c.close
    }));

  state.visibleCandles = [];

  state.currentIndex = -1;

  state.position = null;

  state.trades = [];

  state.realizedPnl = 0;

  state.equity = 0;

  state.peakEquity = 0;

  state.maxDrawdown = 0;

  candleSeries.setData([]);

  chart.timeScale().fitContent();

  chartEmpty.style.display =
    "none";

  updateStats();

  updateReplayUI();

  /*
   * Start replay at first candle.
   */
  if (state.candles.length) {

    state.currentIndex = 0;

    state.visibleCandles = [
      state.candles[0]
    ];

    candleSeries.setData(
      state.visibleCandles
    );

    updateReplayUI();

  }

}


/*
|--------------------------------------------------------------------------
| Replay
|--------------------------------------------------------------------------
*/

function renderCurrentReplay() {

  if (
    state.currentIndex < 0
  ) {
    return;
  }

  state.visibleCandles =
    state.candles.slice(
      0,
      state.currentIndex + 1
    );

  candleSeries.setData(
    state.visibleCandles
  );

  updateReplayUI();

}


function next() {

  if (!state.candles.length) {
    return;
  }

  if (
    state.currentIndex >=
    state.candles.length - 1
  ) {

    stopReplay();

    return;

  }

  state.currentIndex++;

  renderCurrentReplay();

}


function previous() {

  if (!state.candles.length) {
    return;
  }

  if (
    state.currentIndex <= 0
  ) {
    return;
  }

  state.currentIndex--;

  renderCurrentReplay();

}


function startReplay() {

  if (
    state.isPlaying ||
    !state.candles.length
  ) {
    return;
  }

  state.isPlaying = true;

  playReplay.textContent =
    "⏸ Pause";

  const tick = () => {

    if (!state.isPlaying) {
      return;
    }

    if (
      state.currentIndex >=
      state.candles.length - 1
    ) {

      stopReplay();

      return;

    }

    next();

    state.playTimer =
      setTimeout(
        tick,
        Number(speed.value)
      );

  };

  tick();

}


function stopReplay() {

  state.isPlaying = false;

  playReplay.textContent =
    "▶ Play";

  if (state.playTimer) {

    clearTimeout(
      state.playTimer
    );

    state.playTimer = null;

  }

}


previousCandle.addEventListener(
  "click",
  previous
);

nextCandle.addEventListener(
  "click",
  next
);

playReplay.addEventListener(
  "click",
  () => {

    if (state.isPlaying) {

      stopReplay();

    } else {

      startReplay();

    }

  }
);


/*
|--------------------------------------------------------------------------
| Trading
|--------------------------------------------------------------------------
*/

function getCurrentCandle() {

  if (
    state.currentIndex < 0
  ) {
    return null;
  }

  return (
    state.candles[
      state.currentIndex
    ] || null
  );

}


function openPosition(side) {

  const candle =
    getCurrentCandle();

  if (!candle) {
    return;
  }

  if (state.position) {
    return;
  }

  state.position = {
    side,
    entry:
      candle.close,
    time:
      candle.time
  };

  updateStats();

}


function closeCurrentPosition() {

  const candle =
    getCurrentCandle();

  if (
    !candle ||
    !state.position
  ) {
    return;
  }

  const position =
    state.position;

  const direction =
    position.side === "LONG"
      ? 1
      : -1;

  const pnl =
    (
      candle.close -
      position.entry
    ) * direction;

  state.realizedPnl += pnl;

  state.trades.push({
    side:
      position.side,
    entry:
      position.entry,
    exit:
      candle.close,
    pnl
  });

  state.position = null;

  updateStats();

}


buy.addEventListener(
  "click",
  () => openPosition("LONG")
);

sell.addEventListener(
  "click",
  () => openPosition("SHORT")
);

closePosition.addEventListener(
  "click",
  closeCurrentPosition
);


/*
|--------------------------------------------------------------------------
| Stats
|--------------------------------------------------------------------------
*/

function updateStats() {

  const candles =
    state.candles.length;

  document.getElementById(
    "statCandles"
  ).textContent =
    candles.toLocaleString();

  document.getElementById(
    "statPosition"
  ).textContent =
    state.position
      ? state.position.side
      : "FLAT";

  document.getElementById(
    "statTrades"
  ).textContent =
    state.trades.length;

  document.getElementById(
    "statPnl"
  ).textContent =
    state.realizedPnl.toFixed(5);

  const wins =
    state.trades.filter(
      trade =>
        trade.pnl > 0
    ).length;

  const winRate =
    state.trades.length
      ? (
          wins /
          state.trades.length *
          100
        )
      : 0;

  document.getElementById(
    "statWinRate"
  ).textContent =
    `${winRate.toFixed(1)}%`;

  document.getElementById(
    "statDrawdown"
  ).textContent =
    state.maxDrawdown.toFixed(5);

}


/*
|--------------------------------------------------------------------------
| Replay UI
|--------------------------------------------------------------------------
*/

function updateReplayUI() {

  if (!state.candles.length) {

    document.getElementById(
      "replayInfo"
    ).textContent =
      "No data";

    document.getElementById(
      "replayProgressFill"
    ).style.width =
      "0%";

    return;

  }

  const current =
    Math.max(
      0,
      state.currentIndex
    );

  const total =
    state.candles.length;

  const progress =
    total > 1
      ? (
          current /
          (total - 1) *
          100
        )
      : 100;

  const candle =
    state.candles[current];

  const date =
    new Date(
      candle.time * 1000
    );

  document.getElementById(
    "replayInfo"
  ).textContent =
    `${current + 1} / ${total.toLocaleString()} • ${date.toLocaleString()}`;

  document.getElementById(
    "replayProgressFill"
  ).style.width =
    `${progress}%`;

}


/*
|--------------------------------------------------------------------------
| Keyboard shortcuts
|--------------------------------------------------------------------------
*/

document.addEventListener(
  "keydown",
  event => {

    if (
      event.target.tagName ===
      "INPUT"
    ) {
      return;
    }

    if (
      event.code === "ArrowRight"
    ) {

      next();

    }

    if (
      event.code === "ArrowLeft"
    ) {

      previous();

    }

    if (
      event.code === "Space"
    ) {

      event.preventDefault();

      if (state.isPlaying) {
        stopReplay();
      } else {
        startReplay();
      }

    }

  }
);


/*
|--------------------------------------------------------------------------
| Initial state
|--------------------------------------------------------------------------
*/

updateStats();
updateReplayUI();

</script>

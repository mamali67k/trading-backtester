<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
Trading Backtester
</title>

<script
  src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"
></script>

<style>

:root {

  --bg:#080c11;

  --panel:#0d131b;

  --panel2:#101720;

  --border:#202a35;

  --text:#d6dde7;

  --muted:#7d8999;

  --accent:#2962ff;

  --green:#36c98f;

  --red:#ef5350;

  --yellow:#f4c76b;

  --drawing-bg:#0d131b;

}


* {

  box-sizing:border-box;

}


html,
body {

  width:100%;
  height:100%;

  margin:0;

  padding:0;

  overflow:hidden;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


button,
input,
select {

  font-family:
    inherit;

}


button {

  cursor:pointer;

}


.app {

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  background:
    var(--bg);

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

  height:52px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0 16px;

  background:
    #0c1118;

  border-bottom:
    1px solid var(--border);

}


.logo {

  display:flex;

  align-items:center;

  gap:10px;

}


.logo-box {

  width:32px;
  height:32px;

  display:grid;

  place-items:center;

  border-radius:7px;

  background:
    var(--accent);

  font-weight:800;

}


.logo-title {

  font-size:14px;

  font-weight:700;

}


.logo-sub {

  color:
    var(--muted);

  font-size:10px;

}


.status {

  display:flex;

  align-items:center;

  gap:7px;

  color:
    var(--muted);

  font-size:11px;

}


.status-dot {

  width:7px;
  height:7px;

  border-radius:50%;

  background:
    var(--green);

}


/* =========================================================
   MAIN
   ========================================================= */

.main {

  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:
    285px 1fr;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

  min-width:0;

  overflow:auto;

  background:
    #0b1017;

  border-right:
    1px solid var(--border);

  padding:12px;

}


.section {

  margin-bottom:14px;

}


.section-title {

  margin-bottom:8px;

  color:
    #aab5c4;

  font-size:10px;

  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.08em;

}


label {

  display:block;

  margin-bottom:5px;

  color:
    var(--muted);

  font-size:10px;

}


input,
select {

  width:100%;

  height:32px;

  padding:
    0 9px;

  border:
    1px solid #293441;

  border-radius:5px;

  outline:none;

  background:
    #101720;

  color:
    var(--text);

  font-size:11px;

}


input:focus,
select:focus {

  border-color:
    var(--accent);

}


.field {

  margin-bottom:9px;

}


.primary {

  width:100%;

  height:34px;

  border:
    1px solid #356eff;

  border-radius:5px;

  background:
    var(--accent);

  color:white;

  font-size:11px;

  font-weight:700;

}


.primary:hover {

  filter:
    brightness(1.08);

}


.primary:disabled {

  opacity:.5;

  cursor:not-allowed;

}


.status-box {

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:5px;

  background:
    #101720;

  color:
    var(--muted);

  font-size:10px;

  line-height:1.45;

}


.status-box.ok {

  border-color:
    rgba(54,201,143,.35);

  color:
    #79dcae;

}


.status-box.error {

  border-color:
    rgba(239,83,80,.35);

  color:
    #ff8b88;

}


.stats {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;

}


.stat {

  padding:8px;

  border:
    1px solid var(--border);

  border-radius:5px;

  background:
    #101720;

}


.stat-label {

  color:
    var(--muted);

  font-size:9px;

}


.stat-value {

  margin-top:3px;

  color:
    var(--text);

  font-size:12px;

  font-weight:700;

}


.trade-buttons {

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

}


.trade-buttons button {

  height:30px;

  border:
    1px solid #2b3643;

  border-radius:5px;

  background:
    #111923;

  color:
    #aeb8c6;

  font-size:9px;

  font-weight:700;

}


#buy {

  color:#7ee2a8;

}


#sell {

  color:#ff8e8e;

}


#close {

  color:#f4c76b;

}


/* =========================================================
   WORKSPACE
   ========================================================= */

.workspace {

  min-width:0;

  min-height:0;

  display:flex;

  flex-direction:column;

}


/* =========================================================
   TOP TOOLBAR
   ========================================================= */

.toolbar {

  height:44px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  gap:5px;

  padding:
    5px 8px;

  background:
    #0c1118;

  border-bottom:
    1px solid var(--border);

}


.toolbar-spacer {

  flex:1;

}


.toolbar button {

  height:30px;

  padding:
    0 10px;

  border:
    1px solid #2a3542;

  border-radius:5px;

  background:
    #111923;

  color:
    #aeb8c6;

  font-size:10px;

}


.toolbar button:hover {

  color:white;

  border-color:#3a4757;

}


.tf-buttons {

  display:flex;

  gap:3px;

}


.tf {

  min-width:38px;

}


.tf.active {

  color:white;

  background:
    rgba(41,98,255,.18);

  border-color:
    var(--accent);

}


/* =========================================================
   CHART
   ========================================================= */

.chart-area {

  position:relative;

  flex:1;

  min-width:0;

  min-height:0;

  overflow:hidden;

  background:
    #080c11;

}


#chart {

  position:absolute;

  inset:0;

}


/* =========================================================
   CHART MESSAGE
   ========================================================= */

.chart-message {

  position:absolute;

  inset:0;

  display:grid;

  place-items:center;

  color:
    var(--muted);

  font-size:12px;

  pointer-events:none;

  z-index:5;

}


/* =========================================================
   BAR REPLAY MENU
   ========================================================= */

.replay-menu {

  position:absolute;

  top:12px;

  left:50%;

  z-index:40;

  min-width:340px;

  padding:6px;

  background:
    rgba(13,19,27,.97);

  border:
    1px solid var(--border);

  border-radius:8px;

  box-shadow:
    0 10px 28px rgba(0,0,0,.42);

  transform:
    translateX(-50%);

  user-select:none;

}


.replay-menu.dragging {

  opacity:.94;

  cursor:grabbing;

}


.replay-menu-handle {

  height:20px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  color:#8794a6;

  font-size:9px;

  font-weight:700;

  letter-spacing:.08em;

  cursor:grab;

  border-bottom:
    1px solid #27313d;

}


.replay-menu-handle:active {

  cursor:grabbing;

}


.replay-drag-dots {

  letter-spacing:-2px;

  transform:
    rotate(90deg);

  color:#5f6d7e;

}


.replay-menu-actions {

  display:flex;

  align-items:stretch;

  gap:4px;

  padding-top:6px;

}


.replay-action {

  min-width:58px;

  height:42px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:2px;

  padding:
    3px 7px;

  border:
    1px solid transparent;

  border-radius:5px;

  background:
    transparent;

  color:#aeb8c6;

  font-size:9px;

}


.replay-action:hover {

  color:#fff;

  background:
    rgba(255,255,255,.06);

  border-color:#344151;

}


.replay-action.active {

  color:#fff;

  background:
    rgba(41,98,255,.20);

  border-color:
    var(--accent);

}


.replay-action-icon {

  height:18px;

  display:grid;

  place-items:center;

  font-size:16px;

  line-height:1;

}


.replay-speed-row {

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:6px;

  padding:
    5px 3px 2px;

  color:#718095;

  font-size:9px;

}


.replay-speed-row select {

  width:auto;

  min-width:65px;

  height:23px;

  padding:
    0 6px;

  border:
    1px solid #2c3745;

  border-radius:4px;

  background:
    #101720;

  color:#c7d0dc;

  font-size:9px;

  outline:none;

}


.replay-menu-status {

  min-height:15px;

  padding:
    1px 3px 0;

  color:#667487;

  font-size:9px;

  text-align:right;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


#chart.replay-cut-mode {

  cursor:crosshair;

}


/* =========================================================
   DRAWING TOOLBAR
   ========================================================= */

.drawing-toolbar {

  position:absolute;

  top:10px;

  left:10px;

  z-index:30;

  width:44px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:4px;

  padding:5px;

  background:
    rgba(13,19,27,.96);

  border:
    1px solid var(--border);

  border-radius:7px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  transition:
    width .18s ease;

}


.drawing-toolbar.open {

  width:44px;

}


.drawing-toolbar.collapsed {

  width:36px;

  padding:4px;

}


.drawing-tool {

  position:relative;

  width:34px;
  height:34px;

  display:grid;

  place-items:center;

  padding:0;

  border:
    1px solid transparent;

  border-radius:5px;

  background:
    transparent;

  color:
    #aeb8c6;

}


.drawing-tool:hover {

  color:white;

  background:
    rgba(255,255,255,.06);

  border-color:
    #344151;

}


.drawing-tool.active {

  color:white;

  background:
    rgba(41,98,255,.2);

  border-color:
    var(--accent);

}


.drawing-tool svg {

  width:18px;
  height:18px;

  stroke:currentColor;

  fill:none;

  stroke-width:1.7;

  stroke-linecap:round;

  stroke-linejoin:round;

}


.drawing-tool.fill-icon svg {

  fill:currentColor;

  stroke:none;

}


.drawing-divider {

  width:24px;

  height:1px;

  margin:
    2px 0;

  background:
    #2a3542;

}


.drawing-collapse {

  color:
    #9aa7b7;

}


.drawing-collapse svg {

  transition:
    transform .18s ease;

}


.drawing-toolbar.collapsed
.drawing-collapse svg {

  transform:
    rotate(180deg);

}


.drawing-tool::after {

  content:
    attr(data-tooltip);

  position:absolute;

  left:42px;

  top:50%;

  transform:
    translateY(-50%);

  white-space:nowrap;

  padding:
    5px 8px;

  border-radius:5px;

  background:
    #111923;

  border:
    1px solid #344151;

  color:
    #d6dde7;

  font-size:9px;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .12s ease;

}


.drawing-tool:hover::after {

  opacity:1;

}


.drawing-toolbar.collapsed
.drawing-tool[data-tool]::after {

  left:39px;

}


/* =========================================================
   DRAWING CANVAS
   ========================================================= */

#drawingCanvas {

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  z-index:20;

  touch-action:none;

}


/* =========================================================
   BOTTOM STATUS
   ========================================================= */

.bottom {

  display:flex;

  align-items:center;

  padding:
    8px 12px;

  background:
    #0c1118;

  border-top:
    1px solid var(--border);

}


.bottom-info {

  color:
    var(--muted);

  font-size:10px;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:850px) {

  body {

    overflow:auto;

  }


  .main {

    grid-template-columns:
      1fr;

  }


  .sidebar {

    border-right:0;

    border-bottom:
      1px solid var(--border);

  }


  .workspace {

    height:70vh;

  }


  .replay-menu {

    min-width:300px;

    max-width:
      calc(100% - 20px);

  }


  .replay-action {

    min-width:50px;

  }

}

</style>

</head>


<body>


<div class="app">


<header class="header">

  <div class="logo">

    <div class="logo-box">
      TB
    </div>

    <div>

      <div class="logo-title">
        Trading Backtester
      </div>

      <div class="logo-sub">
        FX Research & Replay
      </div>

    </div>

  </div>


  <div class="status">

    <span
      id="statusDot"
      class="status-dot"
    ></span>

    <span id="systemStatus">
      Connecting...
    </span>

  </div>

</header>


<main class="main">


<aside class="sidebar">


<div class="section">

  <div class="section-title">
    Market Data
  </div>


  <div class="field">

    <label>
      FX Pair
    </label>

    <select id="pair">

      <option>
        EUR/USD
      </option>

      <option>
        GBP/USD
      </option>

      <option>
        USD/JPY
      </option>

      <option>
        USD/CHF
      </option>

      <option>
        AUD/USD
      </option>

      <option>
        USD/CAD
      </option>

      <option>
        NZD/USD
      </option>

    </select>

  </div>


  <div class="field">

    <label>
      Output Size
    </label>

    <select id="outputsize">

      <option value="500">
        500
      </option>

      <option value="1000">
        1,000
      </option>

      <option value="2000">
        2,000
      </option>

      <option value="5000" selected>
        5,000
      </option>

    </select>

  </div>


  <div class="field">

    <label>
      Start Date
    </label>

    <input
      id="startDate"
      type="date"
    >

  </div>


  <div class="field">

    <label>
      End Date
    </label>

    <input
      id="endDate"
      type="date"
    >

  </div>


  <button
    id="loadData"
    class="primary"
  >
    Load Market Data
  </button>

</div>


<div class="section">

  <div class="section-title">
    Data Status
  </div>

  <div
    id="dataStatus"
    class="status-box"
  >
    Waiting for data...
  </div>

</div>


<div class="section">

  <div class="section-title">
    Timeframe
  </div>

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        Active
      </div>

      <div
        id="activeTimeframe"
        class="stat-value"
      >
        1m
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Candles
      </div>

      <div
        id="candleCount"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>

</div>


<div class="section">

  <div class="section-title">
    Trading
  </div>


  <div class="trade-buttons">

    <button id="buy">
      BUY
    </button>

    <button id="sell">
      SELL
    </button>

    <button id="close">
      CLOSE
    </button>

  </div>

</div>


<div class="section">

  <div class="section-title">
    Statistics
  </div>


  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        Position
      </div>

      <div
        id="position"
        class="stat-value"
      >
        FLAT
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Trades
      </div>

      <div
        id="trades"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        P&amp;L
      </div>

      <div
        id="pnl"
        class="stat-value"
      >
        0.00000
      </div>

    </div>

  </div>

</div>


<div class="section">

  <div class="section-title">
    Manual CSV
  </div>


  <input
    id="csvFile"
    type="file"
    accept=".csv,text/csv"
  >

  <div
    id="manualStatus"
    class="status-box"
    style="margin-top:7px"
  >
    CSV import available.
  </div>

</div>


</aside>


<section class="workspace">


<!-- =====================================================
     TOP BAR
     ===================================================== -->

<div class="toolbar">


<div class="toolbar-spacer"></div>


<div class="tf-buttons">

<button
  class="tf active"
  data-tf="1"
>
1m
</button>

<button
  class="tf"
  data-tf="5"
>
5m
</button>

<button
  class="tf"
  data-tf="15"
>
15m
</button>

<button
  class="tf"
  data-tf="30"
>
30m
</button>

<button
  class="tf"
  data-tf="60"
>
1H
</button>

<button
  class="tf"
  data-tf="240"
>
4H
</button>

<button
  class="tf"
  data-tf="1440"
>
1D
</button>

</div>


<button
  id="buyTop"
>
BUY
</button>


<button
  id="sellTop"
>
SELL
</button>


<button
  id="closeTop"
>
CLOSE
</button>


</div>


<!-- =====================================================
     CHART AREA
     ===================================================== -->

<div
  id="chartArea"
  class="chart-area"
>


<div id="chart"></div>


<!-- =====================================================
     BAR REPLAY MENU
     ===================================================== -->

<div
  id="replayMenu"
  class="replay-menu"
>


<div
  id="replayMenuHandle"
  class="replay-menu-handle"
  title="Drag to move"
>

  <span>
    BAR REPLAY
  </span>

  <span class="replay-drag-dots">
    ⋮⋮
  </span>

</div>


<div class="replay-menu-actions">


<button
  id="replayPlay"
  class="replay-action"
  title="Play / Pause candles"
  aria-label="Play / Pause candles"
>

  <span
    class="replay-action-icon"
    id="replayPlayIcon"
  >
    ▶
  </span>

  <span>
    Play
  </span>

</button>


<button
  id="replayForward"
  class="replay-action"
  title="One candle forward"
  aria-label="One candle forward"
>

  <span class="replay-action-icon">
    ›
  </span>

  <span>
    +1
  </span>

</button>


<button
  id="replayBack"
  class="replay-action"
  title="One candle backward"
  aria-label="One candle backward"
>

  <span class="replay-action-icon">
    ‹
  </span>

  <span>
    -1
  </span>

</button>


<button
  id="replayCut"
  class="replay-action"
  title="Cut point: click a candle on the chart"
  aria-label="Cut point"
>

  <span class="replay-action-icon">
    ✂
  </span>

  <span>
    Cut
  </span>

</button>


<button
  id="replayReset"
  class="replay-action"
  title="Return chart to initial state"
  aria-label="Reset replay"
>

  <span class="replay-action-icon">
    ↩
  </span>

  <span>
    Reset
  </span>

</button>


</div>


<div class="replay-speed-row">

  <span>
    Speed
  </span>

  <select
    id="replaySpeed"
    aria-label="Replay speed"
  >

    <option value="2000">
      0.25x
    </option>

    <option value="1000">
      0.5x
    </option>

    <option
      value="500"
      selected
    >
      1x
    </option>

    <option value="250">
      2x
    </option>

    <option value="125">
      4x
    </option>

    <option value="63">
      8x
    </option>

  </select>

</div>


<div
  id="replayMenuStatus"
  class="replay-menu-status"
>
  Ready
</div>


</div>


<!-- =====================================================
     DRAWING TOOLBAR
     ===================================================== -->

<div
  id="drawingToolbar"
  class="drawing-toolbar open"
>


<!-- Cursor -->

<button
  class="drawing-tool active"
  data-tool="cursor"
  data-tooltip="Cursor"
  aria-label="Cursor"
>

<svg viewBox="0 0 24 24">

<path
  d="M6 3l11 10-5 1 3 6-2 1-3-6-4 4z"
></path>

</svg>

</button>


<!-- Horizontal -->

<button
  class="drawing-tool"
  data-tool="horizontal"
  data-tooltip="Horizontal Line"
  aria-label="Horizontal Line"
>

<script>

"use strict";


/* =========================================================
   STATE
   ========================================================= */

const state = {

  candles: [],

  timeframe: 1,

  currentIndex: -1,

  position: null,

  trades: [],

  pnl: 0,

  playing: false,

  timer: null,

  replaySpeed: 500,

  replayCutIndex: -1,

  replayMenuDragging: false,

  replayMenuDragOffsetX: 0,

  replayMenuDragOffsetY: 0,

  drawingTool: "cursor",

  drawings: [],

  drawingStart: null,

  drawingPreview: null,

  requestId: 0

};


/* =========================================================
   DOM
   ========================================================= */

const chartArea =
  document.getElementById(
    "chartArea"
  );


const chartElement =
  document.getElementById(
    "chart"
  );


const canvas =
  document.getElementById(
    "drawingCanvas"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


const message =
  document.getElementById(
    "chartMessage"
  );


const drawingToolbar =
  document.getElementById(
    "drawingToolbar"
  );


/* =========================================================
   CHART
   ========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout: {

        background: {
          color:"#080c11"
        },

        textColor:"#8995a5"

      },

      grid: {

        vertLines: {
          color:"#17202a"
        },

        horzLines: {
          color:"#17202a"
        }

      },

      rightPriceScale: {

        borderColor:
          "#202a35"

      },

      timeScale: {

        borderColor:
          "#202a35",

        timeVisible:
          true,

        secondsVisible:
          false

      },

      crosshair: {

        mode:
          LightweightCharts.CrosshairMode.Normal

      },

      handleScroll: {

        mouseWheel:
          true,

        pressedMouseMove:
          true

      },

      handleScale: {

        axisPressedMouseMove:
          true,

        mouseWheel:
          true,

        pinch:
          true

      }

    }
  );


const series =
  chart.addCandlestickSeries({

    upColor:
      "#26a69a",

    downColor:
      "#ef5350",

    borderVisible:
      false,

    wickUpColor:
      "#26a69a",

    wickDownColor:
      "#ef5350"

  });


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

  const width =
    chartElement.clientWidth;

  const height =
    chartElement.clientHeight;


  if (
    width <= 0 ||
    height <= 0
  ) {

    return;

  }


  chart.resize(
    width,
    height
  );


  canvas.width =
    width *
    window.devicePixelRatio;


  canvas.height =
    height *
    window.devicePixelRatio;


  canvas.style.width =
    `${width}px`;


  canvas.style.height =
    `${height}px`;


  ctx.setTransform(
    window.devicePixelRatio,
    0,
    0,
    window.devicePixelRatio,
    0,
    0
  );


  redrawDrawings();

}


window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   CHART RANGE CHANGED
   ========================================================= */

chart.timeScale()
  .subscribeVisibleTimeRangeChange(
    () => {

      redrawDrawings();

    }
  );


/* =========================================================
   TIMEFRAME MAP
   ========================================================= */

const TIMEFRAME_MAP = {

  1:
    "1min",

  5:
    "5min",

  15:
    "15min",

  30:
    "30min",

  60:
    "1h",

  240:
    "4h",

  1440:
    "1day"

};


/* =========================================================
   TIMEFRAME CHANGE
   ========================================================= */

async function changeTimeframe(
  minutes
) {

  const value =
    Number(minutes);


  if (
    !TIMEFRAME_MAP[value]
  ) {

    return;

  }


  state.timeframe =
    value;


  stopReplay();


  updateTimeframeUI();


  const hasData =
    state.candles.length > 0;


  if (!hasData) {

    return;

  }


  await loadAutomatic(
    value,
    true
  );

}


/* =========================================================
   TIMEFRAME UI
   ========================================================= */

function updateTimeframeUI() {

  document
    .querySelectorAll(
      ".tf-btn,.tf"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          Number(
            button.dataset.tf
          ) ===
          state.timeframe
        );

      }
    );


  const active =
    document.getElementById(
      "activeTimeframe"
    );


  if (active) {

    const labels = {

      1:"1m",

      5:"5m",

      15:"15m",

      30:"30m",

      60:"1H",

      240:"4H",

      1440:"1D"

    };


    active.textContent =
      labels[state.timeframe] ||
      `${state.timeframe}m`;

  }

}


document
  .querySelectorAll(
    ".tf-btn,.tf"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          changeTimeframe(
            button.dataset.tf
          );

        }
      );

    }
  );


/* =========================================================
   RENDER CHART
   ========================================================= */

function renderChart(
  fit=true
) {

  if (
    !state.candles.length
  ) {

    series.setData([]);

    message.style.display =
      "grid";

    redrawDrawings();

    return;

  }


  message.style.display =
    "none";


  const visible =
    state.candles.slice(
      0,
      state.currentIndex + 1
    );


  series.setData(
    visible
  );


  if (
    fit &&
    visible.length
  ) {

    chart.timeScale()
      .fitContent();

  }


  redrawDrawings();

}


/* =========================================================
   LOAD AUTOMATIC DATA
   ========================================================= */

async function loadAutomatic(
  timeframeOverride=null,
  preserveExisting=false
) {

  const status =
    document.getElementById(
      "dataStatus"
    );


  const loadButton =
    document.getElementById(
      "loadData"
    );


  const timeframe =
    timeframeOverride !== null
      ? Number(timeframeOverride)
      : state.timeframe;


  const interval =
    TIMEFRAME_MAP[timeframe];


  if (!interval) {

    status.textContent =
      "Unsupported timeframe.";

    status.className =
      "status-box error";

    return;

  }


  const pair =
    document.getElementById(
      "pair"
    ).value;


  const outputsize =
    document.getElementById(
      "outputsize"
    ).value;


  const start =
    document.getElementById(
      "startDate"
    ).value;


  const end =
    document.getElementById(
      "endDate"
    ).value;


  const params =
    new URLSearchParams();


  params.set(
    "pair",
    pair
  );


  params.set(
    "interval",
    interval
  );


  params.set(
    "outputsize",
    outputsize
  );


  if (start) {

    params.set(
      "startDate",
      start
    );

  }


  if (end) {

    params.set(
      "endDate",
      end
    );

  }


  const requestId =
    ++state.requestId;


  status.textContent =
    `Loading ${pair} • ${interval}...`;


  status.className =
    "status-box";


  loadButton.disabled =
    true;


  try {

    const response =
      await fetch(
        `/api/fx/base-candles?${params.toString()}`,
        {

          method:"GET",

          headers: {

            Accept:
              "application/json"

          }

        }
      );


    const data =
      await response.json();


    if (
      requestId !==
      state.requestId
    ) {

      return;

    }


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Data request failed."
      );

    }


    if (
      !Array.isArray(
        data.candles
      ) ||
      !data.candles.length
    ) {

      throw new Error(
        "No candle data received."
      );

    }


    state.timeframe =
      timeframe;


    state.candles =
      data.candles;


    state.currentIndex =
      state.candles.length - 1;


    state.replayCutIndex =
      -1;


    replayCut.classList.remove(
      "active"
    );


    chartElement.classList.remove(
      "replay-cut-mode"
    );


    setReplayStatus(
      "Ready"
    );


    state.position =
      null;


    state.trades =
      [];


    state.pnl =
      0;


    renderChart(true);


    updateStats();

    updateReplay();


    status.textContent =
      `${state.candles.length.toLocaleString()} candles loaded successfully.`;

    status.className =
      "status-box ok";


  } catch(error) {

    if (
      requestId !==
      state.requestId
    ) {

      return;

    }


    status.textContent =
      error.message;


    status.className =
      "status-box error";


  } finally {

    if (
      requestId ===
      state.requestId
    ) {

      loadButton.disabled =
        false;

    }

  }

}


/* =========================================================
   LOAD BUTTON
   ========================================================= */

document
  .getElementById(
    "loadData"
  )
  .addEventListener(
    "click",
    () => {

      loadAutomatic();

    }
  );


/* =========================================================
   CSV IMPORT
   ========================================================= */

document
  .getElementById(
    "csvFile"
  )
  .addEventListener(
    "change",
    async event => {

      const file =
        event.target.files[0];


      if (!file) {

        return;

      }


      try {

        const text =
          await file.text();


        const lines =
          text
            .split(/\r?\n/)
            .map(
              line =>
                line.trim()
            )
            .filter(
              Boolean
            );


        if (
          lines.length < 2
        ) {

          throw new Error(
            "CSV file is empty."
          );

        }


        const header =
          lines[0]
            .toLowerCase()
            .split(",")
            .map(
              value =>
                value.trim()
            );


        const timeIndex =
          header.indexOf("time") >= 0
            ? header.indexOf("time")
            : header.indexOf("date");


        const openIndex =
          header.indexOf("open");


        const highIndex =
          header.indexOf("high");


        const lowIndex =
          header.indexOf("low");


        const closeIndex =
          header.indexOf("close");


        if (
          timeIndex < 0 ||
          openIndex < 0 ||
          highIndex < 0 ||
          lowIndex < 0 ||
          closeIndex < 0
        ) {

          throw new Error(
            "CSV must contain time/date, open, high, low and close columns."
          );

        }


        const candles =
          [];


        for (
          let i=1;
          i<lines.length;
          i++
        ) {

          const row =
            lines[i]
              .split(",")
              .map(
                value =>
                  value.trim()
              );


          const rawTime =
            row[timeIndex];


          const parsedDate =
            Date.parse(
              rawTime
            );


          let time;


          if (
            Number.isFinite(
              Number(rawTime)
            )
          ) {

            const number =
              Number(rawTime);


            time =
              number > 10000000000
                ? Math.floor(number / 1000)
                : number;

          } else {

            time =
              Math.floor(
                parsedDate / 1000
              );

          }


          const open =
            Number(
              row[openIndex]
            );


          const high =
            Number(
              row[highIndex]
            );


          const low =
            Number(
              row[lowIndex]
            );


          const close =
            Number(
              row[closeIndex]
            );


          if (
            !Number.isFinite(time) ||
            !Number.isFinite(open) ||
            !Number.isFinite(high) ||
            !Number.isFinite(low) ||
            !Number.isFinite(close)
          ) {

            continue;

          }


          candles.push({

            time,

            open,

            high,

            low,

            close

          });

        }


        candles.sort(
          (a,b) =>
            a.time - b.time
        );


        const unique =
          [];


        const seen =
          new Set();


        for (
          const candle of candles
        ) {

          if (
            seen.has(
              candle.time
            )
          ) {

            continue;

          }


          seen.add(
            candle.time
          );


          unique.push(
            candle
          );

        }


        if (
          !unique.length
        ) {

          throw new Error(
            "No valid OHLC candles found."
          );

        }


        stopReplay();


        state.candles =
          unique;


        state.currentIndex =
          unique.length - 1;


        state.replayCutIndex =
          -1;


        replayCut.classList.remove(
          "active"
        );


        chartElement.classList.remove(
          "replay-cut-mode"
        );


        state.position =
          null;


        state.trades =
          [];


        state.pnl =
          0;


        renderChart(true);

        updateStats();

        updateReplay();


        const status =
          document.getElementById(
            "manualStatus"
          );


        status.textContent =
          `${candles.length.toLocaleString()} candles loaded from CSV.`;


        status.className =
          "status-box ok";


      } catch(error) {

        const status =
          document.getElementById(
            "manualStatus"
          );


        status.textContent =
          error.message;


        status.className =
          "status-box error";

      }

    }
  );


/* =========================================================
   BAR REPLAY
   ========================================================= */

const replayMenu =
  document.getElementById(
    "replayMenu"
  );


const replayMenuHandle =
  document.getElementById(
    "replayMenuHandle"
  );


const replayPlay =
  document.getElementById(
    "replayPlay"
  );


const replayForward =
  document.getElementById(
    "replayForward"
  );


const replayBack =
  document.getElementById(
    "replayBack"
  );


const replayCut =
  document.getElementById(
    "replayCut"
  );


const replayReset =
  document.getElementById(
    "replayReset"
  );


const replayPlayIcon =
  document.getElementById(
    "replayPlayIcon"
  );


const replaySpeed =
  document.getElementById(
    "replaySpeed"
  );


const replayMenuStatus =
  document.getElementById(
    "replayMenuStatus"
  );


function setReplayStatus(
  text
) {

  replayMenuStatus.textContent =
    text;

}


function renderReplay() {

  if (
    !state.candles.length
  ) {

    series.setData([]);

    updateReplay();

    redrawDrawings();

    return;

  }


  const safeIndex =
    Math.max(
      0,
      Math.min(
        state.currentIndex,
        state.candles.length - 1
      )
    );


  state.currentIndex =
    safeIndex;


  const visible =
    state.candles.slice(
      0,
      safeIndex + 1
    );


  series.setData(
    visible
  );


  updateReplay();

  redrawDrawings();

}


function next() {

  if (
    !state.candles.length
  ) {

    return;

  }


  if (
    state.currentIndex <
    state.candles.length - 1
  ) {

    state.currentIndex++;

    renderReplay();

  } else {

    stopReplay();

    setReplayStatus(
      "End of replay"
    );

  }

}


function previous() {

  if (
    !state.candles.length
  ) {

    return;

  }


  if (
    state.currentIndex >
    0
  ) {

    state.currentIndex--;

    renderReplay();

    setReplayStatus(
      "One candle back"
    );

  }

}


function startReplay() {

  if (
    state.playing ||
    !state.candles.length
  ) {

    return;

  }


  if (
    state.currentIndex >=
    state.candles.length - 1
  ) {

    if (
      state.replayCutIndex >= 0
    ) {

      state.currentIndex =
        state.replayCutIndex;

      renderReplay();

    } else {

      setReplayStatus(
        "Choose a cut point first"
      );

      return;

    }

  }


  state.playing =
    true;


  replayPlay.classList.add(
    "active"
  );


  replayPlayIcon.textContent =
    "Ⅱ";


  setReplayStatus(
    "Playing"
  );


  const loop =
    () => {

      if (
        !state.playing
      ) {

        return;

      }


      if (
        state.currentIndex >=
        state.candles.length - 1
      ) {

        stopReplay();

        setReplayStatus(
          "Replay finished"
        );

        return;

      }


      next();


      if (
        state.playing
      ) {

        state.timer =
          setTimeout(
            loop,
            state.replaySpeed
          );

      }

    };


  state.timer =
    setTimeout(
      loop,
      state.replaySpeed
    );

}


function stopReplay() {

  state.playing =
    false;


  replayPlay.classList.remove(
    "active"
  );


  replayPlayIcon.textContent =
    "▶";


  if (
    state.timer
  ) {

    clearTimeout(
      state.timer
    );


    state.timer =
      null;

  }

}


function cutReplayAtIndex(
  index
) {

  if (
    !state.candles.length
  ) {

    return;

  }


  const safeIndex =
    Math.max(
      0,
      Math.min(
        Number(index),
        state.candles.length - 1
      )
    );


  stopReplay();


  state.replayCutIndex =
    safeIndex;


  state.currentIndex =
    safeIndex;


  renderReplay();


  replayCut.classList.remove(
    "active"
  );


  chartElement.classList.remove(
    "replay-cut-mode"
  );


  const candle =
    state.candles[safeIndex];


  const date =
    candle
      ? new Date(
          candle.time * 1000
        )
      : null;


  setReplayStatus(

    date

      ? `Cut: ${date.toLocaleString()}`

      : "Cut point selected"

  );

}


function findNearestCandleIndex(
  time
) {

  if (
    !state.candles.length
  ) {

    return -1;

  }


  let low =
    0;


  let high =
    state.candles.length - 1;


  while (
    low <= high
  ) {

    const mid =
      Math.floor(
        (low + high) / 2
      );


    const midTime =
      Number(
        state.candles[mid].time
      );


    if (
      midTime ===
      time
    ) {

      return mid;

    }


    if (
      midTime <
      time
    ) {

      low =
        mid + 1;

    } else {

      high =
        mid - 1;

    }

  }


  if (
    low <= 0
  ) {

    return 0;

  }


  if (
    low >=
    state.candles.length
  ) {

    return (
      state.candles.length - 1
    );

  }


  const before =
    state.candles[
      low - 1
    ];


  const after =
    state.candles[
      low
    ];


  return (

    Math.abs(
      Number(before.time) -
      time
    )

    <=

    Math.abs(
      Number(after.time) -
      time
    )

  )

    ? low - 1

    : low;

}


function handleReplayCutClick(
  event
) {

  if (

    state.drawingTool !==
      "cursor" ||

    !replayCut.classList.contains(
      "active"
    ) ||

    !state.candles.length

  ) {

    return;

  }


  const rect =
    chartElement.getBoundingClientRect();


  const x =
    event.clientX -
    rect.left;


  if (
    x < 0 ||
    x > rect.width
  ) {

    return;

  }


  const time =
    coordinateToTime(
      x
    );


  if (
    time === null
  ) {

    return;

  }


  const index =
    findNearestCandleIndex(
      time
    );


  if (
    index >= 0
  ) {

    cutReplayAtIndex(
      index
    );

  }

}

  event => {

      !state.replayMenuDragging
    ) {

      return;

    }


    const areaRect =
      chartArea.getBoundingClientRect();


    const menuRect =
      replayMenu.getBoundingClientRect();


    const maxLeft =
      Math.max(
        0,
        areaRect.width -
        menuRect.width
      );


    const maxTop =
      Math.max(
        0,
        areaRect.height -
        menuRect.height
      );


    const left =
      Math.max(
        0,
        Math.min(

          event.clientX -
          areaRect.left -
          state.replayMenuDragOffsetX,

          maxLeft

        )
      );


    const top =
      Math.max(
        0,
        Math.min(

          event.clientY -
          areaRect.top -
          state.replayMenuDragOffsetY,

          maxTop

        )
      );


    replayMenu.style.left =
      `${left}px`;


    replayMenu.style.top =
      `${top}px`;


    replayMenu.style.right =
      "auto";


    replayMenu.style.bottom =
      "auto";


    replayMenu.style.transform =
      "none";

  }
);

/* =========================================================

   ========================================================= */

function currentCandle() {

  return state.candles[
    state.currentIndex
  ];

function openPosition(
  side
) {

  const candle =
    currentCandle();


  if (!candle) {

    return;

  }


  state.position = {

    side,

    entry:
      candle.close

  };


  updateStats();

}


function closePosition() {

  if (
    !state.position
  ) {

    return;

  }


  const candle =
    currentCandle();


  if (!candle) {

    return;

  }


  const entry =
    state.position.entry;


  const exit =
    candle.close;


  let pnl =
    exit - entry;


  if (
    state.position.side ===
    "SHORT"
  ) {

    pnl =
      entry - exit;

  }


  state.pnl +=
    pnl;


  state.trades.push({

    side:
      state.position.side,

    entry,

    exit,

    pnl

  });


  state.position =
    null;


  updateStats();

}

  const candleCount =
    document.getElementById(
      "candleCount"
    );


  if (candleCount) {

    candleCount.textContent =
      state.candles.length

  document.getElementById(
    "position"
  ).textContent =
    state.position
      ? state.position.side
      : "FLAT";


  document.getElementById(
    "trades"
  ).textContent =
    state.trades.length;


  document.getElementById(
    "pnl"
  ).textContent =
    state.pnl.toFixed(5);

}

  document

      ".drawing-tool[data-tool]"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.tool ===
          tool
        );

      }
    );


  if (
    tool === "cursor"
  ) {

    canvas.style.pointerEvents =
      "none";

    canvas.style.cursor =
      "default";

  } else {

    canvas.style.pointerEvents =
      "auto";

    canvas.style.cursor =
      "crosshair";

  }


  state.drawingStart =
    null;


  state.drawingPreview =
    null;


  redrawDrawings();

}

  .querySelectorAll(
    ".drawing-tool[data-tool]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();


          const tool =
            button.dataset.tool;


          if (
            tool === "undo"
          ) {

            if (
              state.drawings.length
            ) {

              state.drawings.pop();

              redrawDrawings();

            }

            return;

          }


          if (
            tool === "clear"
          ) {

            state.drawings =
              [];

            state.drawingStart =
              null;

            state.drawingPreview =
              null;

            redrawDrawings();

            return;

          }


          setDrawingTool(
            tool
          );

        }
      );

    }
  );

/* =========================================================
   COORDINATE CONVERSION
   ========================================================= */

function coordinateToTime(
  x
) {

  const value =
    chart.timeScale()
      .coordinateToTime(
        x
      );


  if (
    value === null ||
    value === undefined
  ) {

    return null;

  }


  if (
    typeof value ===
    "object"
  ) {

    if (
      "timestamp" in value
    ) {

      return Number(
        value.timestamp
      );

    }


    if (
      "year" in value
    ) {

      return Math.floor(
        Date.UTC(
          value.year,
          value.month - 1,
          value.day
        ) / 1000
      );

    }

  }


  const number =
    Number(value);


  return Number.isFinite(
    number
  )
    ? number
    : null;

}


function coordinateToPrice(
  y
) {

  const value =
    series.coordinateToPrice(
      y
    );


  return Number.isFinite(
    value
  )
    ? value
    : null;

}


function timeToX(
  time
) {

  const value =
    chart.timeScale()
      .timeToCoordinate(
        time
      );


  return value === null
    ? null
    : value;

}


function priceToY(
  price
) {

  const value =
    series.priceToCoordinate(
      price
    );


  return value === null
    ? null
    : value;

}


/* =========================================================
   POINTER POSITION
   ========================================================= */

function getPointerPosition(
  event
) {

  const rect =
    canvas.getBoundingClientRect();


  const x =
    event.clientX -
    rect.left;


  const y =
    event.clientY -
    rect.top;


  const time =
    coordinateToTime(
      x
    );


  const price =
    coordinateToPrice(
      y
    );


  if (
    time === null ||
    price === null
  ) {

    return null;

  }


  return {

    x,

    y,

    time,

    price

  };

}


/* =========================================================
   DRAWING FINISH
   ========================================================= */

function finishDrawing(
  event
) {

  if (
    !state.drawingStart
  ) {

    return;

  }


  const point =
    getPointerPosition(
      event
    );


  if (!point) {

    return;

  }


  let drawing = {

    type:
      state.drawingTool,

    t1:
      state.drawingStart.time,

    p1:
      state.drawingStart.price,

    t2:
      point.time,

    p2:
      point.price

  };


  state.drawings.push(
    drawing
  );


  state.drawingStart =
    null;


  state.drawingPreview =
    null;


  redrawDrawings();

}

    if (
      state.drawingTool ===
      "cursor"
    ) {

      return;

    }


    const point =
      getPointerPosition(
        event
      );


    if (!point) {

      return;

    event.preventDefault();


    canvas.setPointerCapture(
      event.pointerId
    );


    state.drawingStart =
      point;


    state.drawingPreview = {

      type:
        state.drawingTool,

      t1:
        point.time,

      p1:
        point.price,

      t2:
        point.time,

      p2:
        point.price

    };


    if (
      state.drawingTool ===
      "horizontal"
    ) {

      finishDrawing(
        event
      );

    }


    if (
      state.drawingTool ===
      "vertical"
    ) {

      finishDrawing(
        event
      );

    }


    if (
      state.drawingTool ===
      "text"
    ) {

      finishDrawing(
        event
      );

    }


    redrawDrawings();

  }
);

/* =========================================================
   DRAWING RENDER
   ========================================================= */

function drawLine(
  x1,
  y1,
  x2,
  y2,
  options={}
) {

  ctx.save();


  ctx.strokeStyle =
    options.color ||
    "#8da2bd";


  ctx.lineWidth =
    options.width ||
    1.2;


  ctx.setLineDash(
    options.dash ||
    []
  );


  ctx.beginPath();


  ctx.moveTo(
    x1,
    y1
  );


  ctx.lineTo(
    x2,
    y2
  );


  ctx.stroke();


  ctx.restore();

}


function redrawDrawings() {

  if (
    !canvas.width ||
    !canvas.height
  ) {

    return;

  }


  const width =
    canvas.clientWidth;


  const height =
    canvas.clientHeight;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const all =
    state.drawings.slice();


  if (
    state.drawingPreview
  ) {

    all.push(
      state.drawingPreview
    );

  }


  for (
    const drawing of all
  ) {

    const x1 =
      timeToX(
        drawing.t1
      );


    const x2 =
      timeToX(
        drawing.t2
      );


    const y1 =
      priceToY(
        drawing.p1
      );


    const y2 =
      priceToY(
        drawing.p2
      );


    if (
      x1 === null ||
      x2 === null ||
      y1 === null ||
      y2 === null
    ) {

      continue;

    }


    switch (
      drawing.type
    ) {

      case "horizontal":

        drawLine(
          0,
          y1,
          width,
          y1
        );

        break;


      case "vertical":

        drawLine(
          x1,
          0,
          x1,
          height
        );

        break;


      case "trend":

        drawLine(
          x1,
          y1,
          x2,
          y2
        );

        break;


      case "ray": {

        let endX =
          width;


        let endY =
          y2;


        if (
          x2 !== x1
        ) {

          const slope =
            (
              y2 - y1
            ) /
            (
              x2 - x1
            );


          endY =
            y1 +
            slope *
            (
              endX - x1
            );

        }


        drawLine(
          x1,
          y1,
          endX,
          endY
        );

        break;

      }


      case "rectangle":

        ctx.save();


        ctx.strokeStyle =
          "#8da2bd";


        ctx.lineWidth =
          1.2;


        ctx.strokeRect(

          Math.min(
            x1,
            x2
          ),

          Math.min(
            y1,
            y2
          ),

          Math.abs(
            x2 - x1
          ),

          Math.abs(
            y2 - y1
          )

        );


        ctx.restore();

        break;


      case "fibonacci": {

        const levels =
          [
            0,
            .236,
            .382,
            .5,
            .618,
            .786,
            1
          ];


        const top =
          y1;


        const bottom =
          y2;


        for (
          const level of levels
        ) {

          const y =
            top +
            (
              bottom - top
            ) *
            level;


          drawLine(
            Math.min(
              x1,
              x2
            ),
            y,
            Math.max(
              x1,
              x2
            ),
            y
          );

        }


        break;

      }


      case "measure": {

        drawLine(
          x1,
          y1,
          x2,
          y2,
          {
            dash:
              [4,3]
          }
        );


        ctx.save();


        ctx.fillStyle =
          "#aeb8c6";


        ctx.font =
          "10px Arial";


        const dx =
          x2 - x1;


        const dy =
          y2 - y1;


        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        ctx.fillText(
          `${distance.toFixed(1)} px`,
          x2 + 6,
          y2 - 6
        );


        ctx.restore();

        break;

      }


      case "arrow": {

        drawLine(
          x1,
          y1,
          x2,
          y2
        );


        const angle =
          Math.atan2(
            y2 - y1,
            x2 - x1
          );


        const size =
          7;


        drawLine(
          x2,
          y2,
          x2 -
            size *
            Math.cos(
              angle - Math.PI / 6
            ),
          y2 -
            size *
            Math.sin(
              angle - Math.PI / 6
            )
        );


        drawLine(
          x2,
          y2,
          x2 -
            size *
            Math.cos(
              angle + Math.PI / 6
            ),
          y2 -
            size *
            Math.sin(
              angle + Math.PI / 6
            )
        );

        break;

      }


      case "text":

        ctx.save();


        ctx.fillStyle =
          "#c7d0dc";


        ctx.font =
          "12px Arial";


        ctx.fillText(
          "Text",
          x1 + 5,
          y1 - 5
        );


        ctx.restore();

        break;

    }

  }

}


/* =========================================================
   INITIAL SYSTEM STATUS
   ========================================================= */

async function checkSystem() {

  const status =
    document.getElementById(
      "systemStatus"
    );


  try {

    const response =
      await fetch(
        "/api/health",
        {

          method:
            "GET",

          headers: {

            Accept:
              "application/json"

          }

        }
      );


    if (
      response.ok
    ) {

      status.textContent =
        "System Online";

    } else {

      status.textContent =
        "API Error";

    }

  } catch(error) {

    status.textContent =
      "Offline";

  }

}

checkSystem();
